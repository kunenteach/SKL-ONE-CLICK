<script>
/** Paparan dashboard, carta dan eksport CSV. */
async function loadDashboard(quiet=false){const useQuiet=quiet===true;const data=await (useQuiet?serverQuiet:server)('getDashboardData',{year:$('globalYear').value});state.dashboard=data;renderDashboard()}
function renderDashboard(){const d=state.dashboard;$('kpiAverage').textContent=fmt(d.average);$('kpiHighest').textContent=fmt(d.highest?.score);$('kpiHighestName').textContent=d.highest?.name||'Tiada data';$('kpiLowest').textContent=fmt(d.lowest?.score);$('kpiLowestName').textContent=d.lowest?.name||'Tiada data';$('kpiFocus').textContent=d.lowest?`Standard ${d.lowest.standard}`:'—';$('kpiReached').textContent=d.reached;$('kpiNotReached').textContent=d.notReached;
  const change=$('kpiChange');change.textContent=d.change==null?'Tiada data tahun sebelumnya':`${d.change>=0?'▲':'▼'} ${Math.abs(d.change).toFixed(2)} mata berbanding ${d.previousYear}`;change.className=d.change>=0?'positive':'negative';$('summaryList').innerHTML=d.summaries.map(s=>`<li>${esc(s)}</li>`).join('');renderCharts();renderAnalysisTable()}
function renderCharts(){const d=state.dashboard,codes=[...new Set(d.allStandards.map(x=>x.standard))],colors=['#2563eb','#22c55e','#f59e0b','#a855f7','#06b6d4','#ef4444'];
  chart('bar','barChart',{type:'bar',data:{labels:codes,datasets:d.years.map((y,i)=>({label:String(y),data:codes.map(c=>d.allStandards.find(x=>x.year===y&&x.standard===c)?.score??null),backgroundColor:colors[i%colors.length]}))},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100}}}});
  const avgs=d.years.map(y=>{const r=d.allStandards.filter(x=>x.year===y);return r.length?r.reduce((a,x)=>a+x.score,0)/r.length:null});chart('line','lineChart',{type:'line',data:{labels:d.years,datasets:[{label:'Purata',data:avgs,borderColor:'#60a5fa',backgroundColor:'#2563eb33',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100}}}});
  chart('radar','radarChart',{type:'radar',data:{labels:d.standards.map(x=>x.standard),datasets:[{label:String(d.year),data:d.standards.map(x=>x.score),borderColor:'#60a5fa',backgroundColor:'#2563eb44'}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:100,ticks:{display:false}}}}});
  chart('donut','donutChart',{type:'doughnut',data:{labels:['Capai Sasaran','Belum Capai Sasaran'],datasets:[{data:[d.reached,d.notReached],backgroundColor:['#22c55e','#ef4444']}]},options:{responsive:true,maintainAspectRatio:false,cutout:'66%'}});
  chart('item','itemChart',{type:'bar',data:{labels:d.lowItems.map(x=>x.code),datasets:[{label:'Skor',data:d.lowItems.map(x=>x.score),backgroundColor:'#ef4444'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{min:0,max:100}}}})
}
function matrixRows(data){const years=data.years,entries=Object.entries(data.matrix);return entries.map(([code,x])=>{const scores=years.map(y=>x.scores[y]);const valid=scores.filter(v=>v!=null),change=valid.length>1?valid.at(-1)-valid.at(-2):null;return {code,name:x.name,scores,change,status:data.standards.find(s=>s.standard===code)?.status||'—'}})}
function renderAnalysisTable(){if(!state.dashboard)return;const d=state.dashboard,q=$('tableSearch').value.toLowerCase(),rows=matrixRows(d).filter(r=>(r.code+' '+r.name).toLowerCase().includes(q));$('analysisTable').querySelector('thead').innerHTML=`<tr><th>Standard</th><th>Nama Standard</th>${d.years.map(y=>`<th>${y}</th>`).join('')}<th>Perubahan</th><th>Status</th></tr>`;$('analysisTable').querySelector('tbody').innerHTML=rows.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td>${r.scores.map(fmt).map(x=>`<td>${x}</td>`).join('')}<td class="${r.change>=0?'positive':'negative'}">${r.change==null?'—':(r.change>=0?'+':'')+r.change.toFixed(2)}</td><td>${badge(r.status)}</td></tr>`).join('')}
function exportDashboardCsv(){if(!state.dashboard)return;const d=state.dashboard,lines=[['STANDARD','NAMA',...d.years,'PERUBAHAN','STATUS'],...matrixRows(d).map(r=>[r.code,r.name,...r.scores,r.change,r.status])];const csv='\ufeff'+lines.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`analisis-skas-${d.year}.csv`;a.click();URL.revokeObjectURL(a.href)}
</script>
