<!-- Modul settings -->
<section id="page-settings" class="page"><div class="page-head"><div><p class="eyebrow">Pentadbir</p><h1>Tetapan Sistem</h1></div></div><div class="settings-grid"><article class="card"><h2>Tambah Tahun Baharu</h2><p class="helper-copy">Masukkan tahun baharu. Sistem akan menyalin standard dan item daripada tahun terkini tanpa menyalin skor.</p><form id="yearForm"><label>Tahun baharu<input id="newYear" type="number" min="2000" max="2100" required></label><button class="btn top-gap"><i class="fa-solid fa-calendar-plus"></i> Jana Tahun Baharu</button></form></article><article class="card"><h2>Tetapan Umum</h2><form id="settingsForm"><label>Nama Sekolah<input id="setSchool"></label><label>URL Logo<input id="setLogo" type="url"></label><label>Sasaran Lalai<input id="setTarget" type="number" min="0" max="100"></label><label>ID Folder Google Drive<input id="setFolder"></label><button class="btn top-gap">Simpan Tetapan</button></form></article><article class="card span-2"><h2>Pengurusan Pengguna</h2><p class="helper-copy">Kata laluan permulaan: <strong>ADMIN — A001</strong> dan <strong>GURU — A002</strong>. Kata laluan disimpan sebagai hash, bukan teks biasa.</p><form id="userForm" class="filter-row"><label>ID Pengguna / E-mel<input id="setEmail" autocomplete="username" placeholder="contoh: admin01 atau guru@sekolah.edu.my" required></label><label>Nama<input id="setName" required></label><label>Peranan<select id="setRole"><option>GURU</option><option>ADMIN</option></select></label><label>Status<select id="setStatus"><option>AKTIF</option><option>TIDAK AKTIF</option></select></label><button class="btn">Simpan Pengguna</button></form></article></div></section>
