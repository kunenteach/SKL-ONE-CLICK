<script>
const EvidenceState={standardId:'',query:'',filter:'ALL',expanded:new Set(),openGroups:new Set(),drafts:{},dirty:new Set(),pendingPrompt:'',bulkKey:''};
const navigateBeforeEvidence=navigate;
navigate=function(page){
  if(App.page==='evidence'&&page!=='evidence'&&EvidenceState.dirty.size&&!confirm('Anda mempunyai perubahan evidens yang belum disimpan. Tinggalkan halaman ini?'))return;
  if(page==='evidence'){
    if(PpsState.dirty&&!confirm('Perubahan agihan PPS belum disimpan. Teruskan ke Pengisian Evidens?'))return;
    App.page='evidence';renderNav();toggleMobile(false);renderEvidence();return;
  }
  navigateBeforeEvidence(page);
};
window.addEventListener('beforeunload',event=>{if(EvidenceState.dirty.size){event.preventDefault();event.returnValue=''}});

function normalizeEvidenceRecord(row){return {id:String(row.ID_EVIDENS||row.id||''),standard:String(row.STANDARD||row.standard||''),aspectCode:String(row.NO_ASPEK||row.aspectCode||''),subCategory:String(row.SUB_KATEGORI||row.subCategory||''),subItem:String(row.SUB_ITEM||row.subItem||''),name:String(row.NAMA_EVIDENS||row.name||''),locationType:String(row.LOKASI_TYPE||row.locationType||'FIZIKAL'),physicalLocation:String(row.LOKASI_FIZIKAL||row.physicalLocation||''),divider:String(row.NO_DIVIDER||row.divider||''),linkName:String(row.NAMA_LINK||row.linkName||''),linkUrl:String(row.URL_LINK||row.linkUrl||''),notes:String(row.CATATAN||row.notes||''),status:String(row.STATUS||row.status||''),updatedAt:row.UPDATED_AT||row.updatedAt||''}}
function normalizeEvidenceFile(row){return {id:String(row.ID_FILE||row.id||''),evidenceId:String(row.ID_EVIDENS||row.evidenceId||''),fileId:String(row.FILE_ID||row.fileId||''),fileUrl:String(row.FILE_URL||row.fileUrl||''),fileName:String(row.FILE_NAME||row.fileName||''),mimeType:String(row.MIME_TYPE||row.mimeType||''),uploader:String(row.UPLOADED_BY||row.uploader||''),timestamp:row.UPLOADED_AT||row.timestamp||''}}
function evidenceRecords(){return (App.data.evidenceData&&App.data.evidenceData.records||[]).map(normalizeEvidenceRecord)}
function evidenceFiles(){return (App.data.evidenceData&&App.data.evidenceData.files||[]).map(normalizeEvidenceFile)}
function evidenceKey(item){return [item.standard,item.aspectCode,item.subCategory||'',item.subItem||''].join('|')}
function recordsFor(target){return evidenceRecords().filter(item=>evidenceKey(item)===ppsKey(target)).map(item=>({...item,files:evidenceFiles().filter(file=>file.evidenceId===item.id)}))}
function currentEvidenceStandard(){return App.data.ppsConfig.standards.find(item=>item.id===EvidenceState.standardId)}
function currentEvidenceTargets(){const standard=currentEvidenceStandard();return standard?ppsTargets(standard):[]}
function currentAssignments(target){return (App.data.assignments||[]).map(normalizePpsAssignment).filter(item=>ppsKey(item)===ppsKey(target))}
function draftFor(target){const key=ppsKey(target);if(!EvidenceState.drafts[key]){const saved=recordsFor(target);EvidenceState.drafts[key]=saved.length?JSON.parse(JSON.stringify(saved)):[blankEvidence()]}return EvidenceState.drafts[key]}
function blankEvidence(name){return {id:'',name:name||'',locationType:'FIZIKAL',physicalLocation:'',divider:'',linkName:'',linkUrl:'',notes:'',files:[]}}

function renderEvidence(){
  const select=`<section class="evidence-select panel"><label><span class="eyebrow">PILIH STANDARD</span><select id="evidenceStandard" class="field"><option value="">Pilih Standard</option>${App.data.ppsConfig.standards.map(s=>`<option value="${s.id}" ${s.id===EvidenceState.standardId?'selected':''}>${escapeHtml(s.title)}</option>`).join('')}</select></label></section>`;
  document.getElementById('content').innerHTML=pageHead('PENGURUSAN KAMI','Pengisian Evidens','Rekod dan urus evidens mengikut aspek serta PPS yang telah diagihkan.')+select+(EvidenceState.standardId?renderEvidenceStandard():'<article class="panel evidence-welcome"><div class="empty-icon">▤</div><h3>Pilih Standard untuk bermula</h3><p>Hanya aspek bagi standard yang dipilih akan dimuatkan.</p></article>');
  bindEvidenceEvents();
}

function renderEvidenceStandard(){const standard=currentEvidenceStandard(),targets=currentEvidenceTargets(),summary=evidenceSummary(targets);return `<section class="evidence-standard-header"><div><p class="eyebrow">${escapeHtml(standard.id.replace('STD','STANDARD '))}</p><h3>${escapeHtml(standard.title.replace(/^STANDARD [^—]+—\s*/,''))}</h3><p>${summary.filled} / ${summary.total} aspek mempunyai evidens · ${summary.evidence} evidens direkodkan</p></div><div class="evidence-totals"><b>${summary.percent}%</b><span>${summary.upload} Upload · ${summary.link} Link · ${summary.physical} Fail Fizikal</span></div><div class="track"><div class="fill" style="width:${summary.percent}%"></div></div></section><section class="evidence-controls"><span>${standard.id.replace('STD','Standard ')}</span><label class="search"><i>⌕</i><input id="evidenceSearch" class="field" value="${escapeAttribute(EvidenceState.query)}" placeholder="Cari aspek atau evidens..."></label><select id="evidenceFilter" class="field filter"><option value="ALL">SEMUA</option><option value="EMPTY" ${EvidenceState.filter==='EMPTY'?'selected':''}>BELUM DIISI</option><option value="FILLED" ${EvidenceState.filter==='FILLED'?'selected':''}>TELAH DIISI</option><option value="FIZIKAL" ${EvidenceState.filter==='FIZIKAL'?'selected':''}>FAIL FIZIKAL</option><option value="LINK" ${EvidenceState.filter==='LINK'?'selected':''}>LINK</option><option value="UPLOAD" ${EvidenceState.filter==='UPLOAD'?'selected':''}>UPLOAD</option></select><button class="btn secondary" id="expandAllEvidence">Kembangkan Semua</button><button class="btn secondary" id="collapseAllEvidence">Minimumkan Semua</button></section><div class="evidence-groups">${renderEvidenceGroups(standard,targets)}</div>`}
function evidenceSummary(targets){const lists=targets.map(recordsFor),all=lists.flat(),filled=lists.filter(list=>list.length).length;return {total:targets.length,filled:filled,evidence:all.length,upload:all.filter(e=>e.locationType==='UPLOAD').length,link:all.filter(e=>e.locationType==='LINK').length,physical:all.filter(e=>e.locationType==='FIZIKAL').length,percent:targets.length?Math.round(filled/targets.length*100):0}}
function renderEvidenceGroups(standard,targets){const query=EvidenceState.query.toLowerCase();return standard.groups.map(group=>{let selected=targets.filter(t=>t.groupCode===group.code).filter(target=>evidenceTargetVisible(target,query));if(!selected.length)return '';if(group.subCategory)return renderEvidenceNestedGroup(group,selected);return `<section class="evidence-group"><header><span>${group.code}</span><div><small>ASPEK UTAMA</small><h3>${escapeHtml(group.name)}</h3></div></header>${selected.map(renderEvidenceCard).join('')}</section>`}).join('')||`<article class="panel">${emptyState('Tiada aspek atau evidens sepadan dengan carian semasa.')}</article>`}
function evidenceTargetVisible(target,query){const records=recordsFor(target),assignments=currentAssignments(target),hay=[target.aspectCode,target.description,target.groupName,target.subItem].concat(records.flatMap(e=>[e.name,e.linkName,e.linkUrl]),assignments.flatMap(a=>[a.teacherName,a.position])).join(' ').toLowerCase(),typeMatch=EvidenceState.filter==='ALL'||(EvidenceState.filter==='EMPTY'&&!records.length)||(EvidenceState.filter==='FILLED'&&records.length)||(EvidenceState.filter==='FIZIKAL'&&records.some(e=>e.locationType==='FIZIKAL'))||(EvidenceState.filter==='LINK'&&records.some(e=>e.locationType==='LINK'))||(EvidenceState.filter==='UPLOAD'&&records.some(e=>e.locationType==='UPLOAD'));return (!query||hay.includes(query))&&typeMatch}
function renderEvidenceNestedGroup(group,targets){const items=[...new Set(targets.map(t=>t.subItem))];return `<section class="evidence-group nested"><header><span>${group.code}</span><div><small>${group.subCategory.replaceAll('_',' ')}</small><h3>${escapeHtml(group.name)}</h3></div></header><div class="evidence-subitems">${items.map(name=>{const list=targets.filter(t=>t.subItem===name),count=list.flatMap(recordsFor).length,key=group.subCategory+'|'+name,open=EvidenceState.openGroups.has(key);return `<article class="evidence-subitem ${open?'open':''}"><button class="evidence-subitem-toggle" data-evidence-group="${escapeAttribute(key)}"><i>›</i><div><b>${escapeHtml(name)}</b><small>${list.length} aspek · ${count} evidens</small></div><span>${list.reduce((sum,t)=>sum+currentAssignments(t).length,0)} PPS</span></button><div class="evidence-subitem-content">${list.map(renderEvidenceCard).join('')}</div></article>`}).join('')}</div></section>`}
function renderEvidenceCard(target){const key=ppsKey(target),records=recordsFor(target),assignments=currentAssignments(target),expanded=EvidenceState.expanded.has(key),upload=records.filter(e=>e.locationType==='UPLOAD').length,link=records.filter(e=>e.locationType==='LINK').length,physical=records.filter(e=>e.locationType==='FIZIKAL').length,last=records.map(e=>e.updatedAt).filter(Boolean).sort().at(-1);return `<article class="evidence-card ${expanded?'expanded':''}" data-evidence-key="${escapeAttribute(key)}"><div class="evidence-card-primary"><div class="evidence-code"><b>${target.aspectCode}</b><span class="evidence-badge ${records.length?'filled':'unfilled'}">${records.length?'TELAH DIISI':'BELUM DIISI'}</span></div><div class="evidence-description"><h4>${escapeHtml(target.description)}</h4>${target.subItem?`<small>${escapeHtml(target.subItem)}</small>`:''}<div class="evidence-pps">${assignments.length?assignments.map(a=>`<span><b>${escapeHtml(a.teacherName)}</b> — ${escapeHtml(a.position)}</span>`).join(''):'<span>Tiada PPS ditugaskan · <button data-go-pps>Ubah Agihan PPS</button></span>'}</div></div><div class="evidence-micro"><b>${records.length} evidens direkodkan</b><span>${upload} upload · ${link} link · ${physical} fail fizikal</span>${last?`<small>Kemaskini: ${formatEvidenceDate(last)}</small>`:''}${evidencePreview(records)}</div><div class="evidence-actions"><button class="btn secondary" data-open-evidence="${escapeAttribute(key)}">${records.length?'EDIT EVIDENS':'+ ISI EVIDENS'}</button><button class="evidence-chevron" data-toggle-evidence="${escapeAttribute(key)}">⌄</button></div></div><div class="evidence-editor">${expanded?renderEvidenceEditor(target):''}</div></article>`}
function evidencePreview(records){if(!records.length)return '<small>Belum ada evidens direkodkan.</small>';const names=records.slice(0,2).map(e=>`<small>• ${escapeHtml(e.name)}</small>`).join('');return names+(records.length>2?`<small>+ ${records.length-2} lagi</small>`:'')}
function renderEvidenceEditor(target){const key=ppsKey(target),entries=draftFor(target);return `<div class="editor-heading"><div><p class="eyebrow">EDITOR EVIDENS</p><h4>${target.aspectCode}${target.subItem?' · '+escapeHtml(target.subItem):''}</h4></div><div class="editor-heading-actions"><span class="evidence-dirty ${EvidenceState.dirty.has(key)?'visible':''}">• Perubahan belum disimpan</span><button class="btn secondary" data-toggle-bulk="${escapeAttribute(key)}">IMPORT PUKAL</button></div></div>${EvidenceState.pendingPrompt===key?renderEvidencePrompt(key):''}${EvidenceState.bulkKey===key?renderBulkEvidence(key):''}<div class="evidence-table-head"><span>NAMA EVIDENS</span><span>LOKASI EVIDENS</span><span>MAKLUMAT LOKASI</span><span>TINDAKAN</span></div><div class="evidence-entry-list">${entries.map((entry,index)=>renderEvidenceEntry(key,entry,index)).join('')}</div><div class="evidence-editor-footer"><button class="add-evidence-entry" data-add-evidence="${escapeAttribute(key)}">+ TAMBAH EVIDENS</button><div><button class="btn secondary" data-cancel-evidence="${escapeAttribute(key)}">BATAL</button><button class="btn primary" data-save-evidence="${escapeAttribute(key)}">SIMPAN EVIDENS</button></div></div>`}
function renderBulkEvidence(key){return `<section class="bulk-evidence"><div><p class="eyebrow">IMPORT SENARAI EVIDENS</p><h4>Paste satu evidens pada setiap baris</h4><small>Nombor seperti 1., 2), bullet dan baris kosong akan dibersihkan secara automatik.</small></div><textarea id="bulkEvidenceInput" class="field" rows="7" placeholder="1. Minit Mesyuarat\n2. Surat Panggilan\n3. Laporan Program"></textarea><div class="bulk-actions"><button class="btn secondary" data-cancel-bulk>BATAL</button><button class="btn primary" data-import-bulk="${escapeAttribute(key)}">BINA JADUAL</button></div></section>`}
function renderEvidencePrompt(key){return `<div class="evidence-prompt"><span>Anda mempunyai perubahan yang belum disimpan.</span><div><button class="btn secondary" data-prompt-cancel>BATAL</button><button class="btn secondary" data-prompt-discard="${escapeAttribute(key)}">BUANG PERUBAHAN</button><button class="btn primary" data-save-evidence="${escapeAttribute(key)}">SIMPAN</button></div></div>`}
function renderEvidenceEntry(key,entry,index){const physical=entry.locationType==='FIZIKAL',link=entry.locationType==='LINK';return `<section class="evidence-entry"><header><div><small>EVIDENS ${index+1}</small><b>${escapeHtml(entry.name||'Evidens baharu')}</b></div><button class="remove-evidence-entry" data-remove-evidence="${escapeAttribute(key)}" data-index="${index}">BUANG</button></header><label>Nama Evidens<input class="field evidence-name" data-key="${escapeAttribute(key)}" data-index="${index}" value="${escapeAttribute(entry.name)}" placeholder="Contoh: Minit Mesyuarat"></label><div class="location-choice"><span>Lokasi Evidens</span><div class="segmented"><button class="${physical?'active':''}" data-location="FIZIKAL" data-key="${escapeAttribute(key)}" data-index="${index}">FAIL</button><button class="${link?'active':''}" data-location="LINK" data-key="${escapeAttribute(key)}" data-index="${index}">LINK</button><button class="${!physical&&!link?'active':''}" data-location="UPLOAD" data-key="${escapeAttribute(key)}" data-index="${index}">UPLOAD</button></div></div>${physical?`<div class="physical-fields"><label>Nama Fail / Lokasi Fail<input class="field evidence-physical" data-key="${escapeAttribute(key)}" data-index="${index}" value="${escapeAttribute(entry.physicalLocation)}" placeholder="Contoh: Fail Kurikulum"></label><label>No. Divider / Bahagian<input class="field evidence-divider" data-key="${escapeAttribute(key)}" data-index="${index}" value="${escapeAttribute(entry.divider)}" placeholder="Contoh: Divider 3.1.2"></label></div>`:link?`<div class="link-fields"><label>Nama Link<input class="field evidence-link-name" data-key="${escapeAttribute(key)}" data-index="${index}" value="${escapeAttribute(entry.linkName||'')}" placeholder="Contoh: Folder Google Drive"></label><label>URL Link<input class="field evidence-link-url" type="url" data-key="${escapeAttribute(key)}" data-index="${index}" value="${escapeAttribute(entry.linkUrl||'')}" placeholder="https://..."></label></div>`:renderUploadZone(key,entry,index)}<label>Catatan <span>(Pilihan)</span><textarea class="field evidence-notes" data-key="${escapeAttribute(key)}" data-index="${index}" rows="2">${escapeHtml(entry.notes||'')}</textarea></label></section>`}
function renderUploadZone(key,entry,index){return `<div class="upload-zone" data-drop-key="${escapeAttribute(key)}" data-index="${index}"><input type="file" class="evidence-file-input" data-key="${escapeAttribute(key)}" data-index="${index}" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx"><div class="upload-callout"><b>Seret & lepas fail di sini</b><span>atau klik untuk memilih fail · maksimum 10 MB setiap fail</span></div></div><div class="evidence-files">${(entry.files||[]).map((file,fileIndex)=>`<div class="evidence-file ${file.error?'error':''}"><div><b>${escapeHtml(file.fileName)}</b><small>${file.error||file.mimeType||'Sedia dimuat naik'}</small>${file.base64&&!file.error?'<span class="file-progress"><i style="width:100%"></i></span>':''}</div>${file.fileUrl||file.previewUrl?`<a href="${escapeAttribute(file.fileUrl||file.previewUrl)}" target="_blank" rel="noopener">LIHAT</a>`:''}<button data-replace-file="${escapeAttribute(key)}" data-index="${index}" data-file-index="${fileIndex}">GANTI</button><button data-remove-file="${escapeAttribute(key)}" data-index="${index}" data-file-index="${fileIndex}">PADAM</button></div>`).join('')}</div>`}

function bindEvidenceEvents(){const standard=document.getElementById('evidenceStandard');if(standard)standard.onchange=()=>switchEvidenceStandard(standard.value);const search=document.getElementById('evidenceSearch');if(search)search.oninput=debounce(e=>{EvidenceState.query=e.target.value;renderEvidence()},180);const filter=document.getElementById('evidenceFilter');if(filter)filter.onchange=e=>{EvidenceState.filter=e.target.value;renderEvidence()};document.querySelectorAll('[data-evidence-group]').forEach(b=>b.onclick=()=>toggleEvidenceGroup(b.dataset.evidenceGroup));document.querySelectorAll('[data-open-evidence]').forEach(b=>b.onclick=()=>openEvidenceEditor(b.dataset.openEvidence));document.querySelectorAll('[data-toggle-evidence]').forEach(b=>b.onclick=()=>toggleEvidenceEditor(b.dataset.toggleEvidence));document.querySelectorAll('[data-add-evidence]').forEach(b=>b.onclick=()=>addEvidenceEntry(b.dataset.addEvidence));document.querySelectorAll('[data-remove-evidence]').forEach(b=>b.onclick=()=>removeEvidenceEntry(b.dataset.removeEvidence,Number(b.dataset.index)));document.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>changeEvidenceLocation(b));document.querySelectorAll('.evidence-name,.evidence-physical,.evidence-divider,.evidence-link-name,.evidence-link-url,.evidence-notes').forEach(input=>input.oninput=()=>updateEvidenceField(input));document.querySelectorAll('[data-toggle-bulk]').forEach(b=>b.onclick=()=>{EvidenceState.bulkKey=EvidenceState.bulkKey===b.dataset.toggleBulk?'':b.dataset.toggleBulk;renderEvidence()});document.querySelectorAll('[data-import-bulk]').forEach(b=>b.onclick=()=>importBulkEvidence(b.dataset.importBulk));document.querySelectorAll('[data-cancel-bulk]').forEach(b=>b.onclick=()=>{EvidenceState.bulkKey='';renderEvidence()});document.querySelectorAll('.evidence-file-input').forEach(input=>input.onchange=()=>readEvidenceFiles(input,input.files));document.querySelectorAll('.upload-zone').forEach(zone=>{zone.ondragover=e=>{e.preventDefault();zone.classList.add('dragging')};zone.ondragleave=()=>zone.classList.remove('dragging');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('dragging');readEvidenceFiles(zone,e.dataTransfer.files)}});document.querySelectorAll('[data-remove-file]').forEach(b=>b.onclick=()=>removeEvidenceFile(b));document.querySelectorAll('[data-replace-file]').forEach(b=>b.onclick=()=>replaceEvidenceFile(b));document.querySelectorAll('[data-save-evidence]').forEach(b=>b.onclick=()=>saveEvidenceContext(b.dataset.saveEvidence,b));document.querySelectorAll('[data-cancel-evidence]').forEach(b=>b.onclick=()=>requestCloseEvidence(b.dataset.cancelEvidence));document.querySelectorAll('[data-prompt-discard]').forEach(b=>b.onclick=()=>discardEvidenceChanges(b.dataset.promptDiscard));document.querySelectorAll('[data-prompt-cancel]').forEach(b=>b.onclick=()=>{EvidenceState.pendingPrompt='';renderEvidence()});document.querySelectorAll('[data-go-pps]').forEach(b=>b.onclick=()=>navigate('pps'));const expand=document.getElementById('expandAllEvidence'),collapse=document.getElementById('collapseAllEvidence');if(expand)expand.onclick=()=>{currentEvidenceTargets().forEach(t=>EvidenceState.expanded.add(ppsKey(t)));renderEvidence()};if(collapse)collapse.onclick=collapseAllEvidence}
function switchEvidenceStandard(id){if(EvidenceState.dirty.size&&!confirm('Perubahan belum disimpan. Tukar standard dan buang perubahan?')){renderEvidence();return}EvidenceState.standardId=id;EvidenceState.query='';EvidenceState.filter='ALL';EvidenceState.expanded.clear();EvidenceState.openGroups.clear();EvidenceState.drafts={};EvidenceState.dirty.clear();renderEvidence()}
function toggleEvidenceGroup(key){EvidenceState.openGroups.has(key)?EvidenceState.openGroups.delete(key):EvidenceState.openGroups.add(key);renderEvidence()}
function openEvidenceEditor(key){EvidenceState.expanded.add(key);renderEvidence()}
function toggleEvidenceEditor(key){EvidenceState.expanded.has(key)?requestCloseEvidence(key):openEvidenceEditor(key)}
function requestCloseEvidence(key){if(EvidenceState.dirty.has(key)){EvidenceState.pendingPrompt=key;renderEvidence();return}EvidenceState.expanded.delete(key);renderEvidence()}
function collapseAllEvidence(){if(EvidenceState.dirty.size){showToast('Simpan atau buang perubahan sebelum minimumkan semua.');return}EvidenceState.expanded.clear();renderEvidence()}
function addEvidenceEntry(key){EvidenceState.drafts[key].push(blankEvidence());markEvidenceDirty(key);renderEvidence()}
function updateEvidenceField(input){const entry=EvidenceState.drafts[input.dataset.key][Number(input.dataset.index)],map={'evidence-name':'name','evidence-physical':'physicalLocation','evidence-divider':'divider','evidence-link-name':'linkName','evidence-link-url':'linkUrl','evidence-notes':'notes'},className=Object.keys(map).find(name=>input.classList.contains(name));entry[map[className]]=input.value;markEvidenceDirty(input.dataset.key)}
function changeEvidenceLocation(button){const entry=EvidenceState.drafts[button.dataset.key][Number(button.dataset.index)],next=button.dataset.location;if(next!=='UPLOAD'&&entry.files.length&&!confirm('Tukar lokasi dan keluarkan semua fail upload daripada evidens ini?'))return;if(next!=='UPLOAD')entry.files=[];if(next!=='LINK'){entry.linkName='';entry.linkUrl=''}if(next!=='FIZIKAL'){entry.physicalLocation='';entry.divider=''}entry.locationType=next;markEvidenceDirty(button.dataset.key);renderEvidence()}
function parseBulkEvidence(text){const seen=new Set();return String(text||'').split(/\r?\n/).map(line=>line.trim().replace(/^\s*(?:\d{1,3}\s*[.)\-:]|[-•*])\s*/,'').trim()).filter(name=>{const key=name.toLocaleLowerCase('ms');if(!name||seen.has(key))return false;seen.add(key);return true})}
function importBulkEvidence(key){const input=document.getElementById('bulkEvidenceInput'),names=parseBulkEvidence(input&&input.value),existing=new Set((EvidenceState.drafts[key]||[]).map(item=>item.name.trim().toLocaleLowerCase('ms')).filter(Boolean)),fresh=names.filter(name=>!existing.has(name.toLocaleLowerCase('ms')));if(!fresh.length){showToast('Tiada evidens baharu ditemui. Semak senarai atau rekod pendua.');return}EvidenceState.drafts[key]=(EvidenceState.drafts[key]||[]).filter(item=>item.id||item.name.trim()).concat(fresh.map(blankEvidence));EvidenceState.bulkKey='';markEvidenceDirty(key);renderEvidence();showToast(`✓ ${fresh.length} baris evidens berjaya dibina.`)}
function markEvidenceDirty(key){EvidenceState.dirty.add(key);const card=document.querySelector(`[data-evidence-key="${CSS.escape(key)}"]`);if(card){const indicator=card.querySelector('.evidence-dirty');if(indicator)indicator.classList.add('visible')}}
function removeEvidenceEntry(key,index){const entry=EvidenceState.drafts[key][index];if(entry.id&&!confirm('Adakah anda pasti mahu memadam evidens ini? Perubahan berkuat kuasa selepas disimpan.'))return;EvidenceState.drafts[key].splice(index,1);markEvidenceDirty(key);renderEvidence()}
function readEvidenceFiles(source,fileList){const key=source.dataset.key||source.dataset.dropKey,index=Number(source.dataset.index),entry=EvidenceState.drafts[key][index],files=Array.from(fileList||[]),allowed=['application/pdf','image/jpeg','image/png','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-excel','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];files.forEach(file=>{const pending={id:'',fileId:'',fileUrl:'',fileName:file.name,mimeType:file.type,error:''};entry.files.push(pending);if(file.size>10*1024*1024||!allowed.includes(file.type)){pending.error=file.size>10*1024*1024?'Fail melebihi 10 MB.':'Format fail tidak disokong.';markEvidenceDirty(key);renderEvidence();return}const reader=new FileReader();reader.onload=()=>{pending.base64=String(reader.result).split(',')[1];pending.previewUrl=file.type.startsWith('image/')?reader.result:'';markEvidenceDirty(key);renderEvidence()};reader.onerror=()=>{pending.error='Fail tidak dapat dibaca.';renderEvidence()};reader.readAsDataURL(file)});markEvidenceDirty(key);renderEvidence()}
function removeEvidenceFile(button){EvidenceState.drafts[button.dataset.removeFile][Number(button.dataset.index)].files.splice(Number(button.dataset.fileIndex),1);markEvidenceDirty(button.dataset.removeFile);renderEvidence()}
function replaceEvidenceFile(button){const key=button.dataset.replaceFile,index=Number(button.dataset.index);EvidenceState.drafts[key][index].files.splice(Number(button.dataset.fileIndex),1);markEvidenceDirty(key);renderEvidence();const input=document.querySelector(`.evidence-file-input[data-key="${CSS.escape(key)}"][data-index="${index}"]`);if(input)input.click()}
function discardEvidenceChanges(key){delete EvidenceState.drafts[key];EvidenceState.dirty.delete(key);EvidenceState.pendingPrompt='';EvidenceState.expanded.delete(key);renderEvidence()}
function saveEvidenceContext(key,button){const target=currentEvidenceTargets().find(t=>ppsKey(t)===key),entries=EvidenceState.drafts[key];if(!target||!entries||entries.some(e=>!e.name.trim()||(e.locationType==='FIZIKAL'&&!e.physicalLocation.trim())||(e.locationType==='LINK'&&(!e.linkName.trim()||!/^https:\/\//i.test(e.linkUrl.trim())))||(e.locationType==='UPLOAD'&&(!e.files.length||e.files.some(f=>f.error||(!f.fileId&&!f.base64)))))){showToast('Lengkapkan nama dan lokasi bagi setiap evidens. Link mesti bermula dengan https://.');return}button.disabled=true;button.textContent='MENYIMPAN...';callServer('saveAspectEvidence',{context:{standard:target.standard,aspectCode:target.aspectCode,subCategory:target.subCategory,subItem:target.subItem},entries:entries},result=>{App.data.evidenceData={records:result.records,files:result.files};delete EvidenceState.drafts[key];EvidenceState.dirty.delete(key);EvidenceState.pendingPrompt='';EvidenceState.bulkKey='';EvidenceState.expanded.delete(key);renderEvidence();showToast(`✓ ${result.savedCount} evidens bagi Aspek ${target.aspectCode} berjaya disimpan.`)},error=>{button.disabled=false;button.textContent='SIMPAN EVIDENS';showToast('Evidens tidak dapat disimpan. Sila cuba semula.');console.error(error)})}
function formatEvidenceDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('ms-MY',{dateStyle:'short',timeStyle:'short'})}
</script>
