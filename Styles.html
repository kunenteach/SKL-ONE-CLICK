/* Futuristic Jungle Kids theme — decorative only; application behaviour is unchanged. */
body{
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(circle at 8% 12%,rgba(255,230,109,.7) 0 5%,transparent 18%),
    radial-gradient(circle at 88% 16%,rgba(126,249,255,.5) 0 7%,transparent 22%),
    radial-gradient(circle at 72% 88%,rgba(214,157,255,.48) 0 8%,transparent 24%),
    linear-gradient(145deg,#eaffd8 0%,#dffcff 38%,#f3e6ff 70%,#fff4c9 100%);
  background-attachment:fixed;
}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:-1}
body::before{
  inset:0;
  opacity:.5;
  background-image:
    radial-gradient(ellipse at 4% 95%,#22c55e 0 7%,transparent 7.5%),
    radial-gradient(ellipse at 14% 101%,#16a34a 0 10%,transparent 10.5%),
    radial-gradient(ellipse at 96% 94%,#10b981 0 8%,transparent 8.5%),
    radial-gradient(ellipse at 86% 103%,#059669 0 11%,transparent 11.5%);
  filter:drop-shadow(0 -10px 24px rgba(5,150,105,.2));
}
body::after{
  width:160px;height:160px;right:5vw;top:8vh;border-radius:50%;
  background:radial-gradient(circle,#fff 0 2%,#b8fff4 3% 8%,rgba(71,237,255,.28) 9% 34%,transparent 35%);
  box-shadow:-70vw 13vh 0 -48px rgba(255,255,255,.7),-42vw 64vh 0 -56px rgba(255,243,147,.8),-15vw 72vh 0 -50px rgba(211,163,255,.65);
  animation:jungleFloat 7s ease-in-out infinite;
}
.app-shell{position:relative;background:linear-gradient(120deg,rgba(236,255,226,.68),rgba(229,250,255,.68) 50%,rgba(247,232,255,.64))}
.app-shell::after{content:"🌿";position:fixed;right:22px;bottom:14px;font-size:72px;opacity:.3;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(4,120,87,.2));animation:jungleFloat 5s ease-in-out infinite}
.sidebar{
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(235,255,242,.88));
  border-right:1px solid rgba(255,255,255,.9);
  box-shadow:14px 0 45px rgba(16,185,129,.13);
}
.side-head{border-radius:24px;background:linear-gradient(145deg,rgba(210,255,226,.8),rgba(218,244,255,.75),rgba(244,225,255,.72));border:1px solid rgba(255,255,255,.95)}
.logo-badge,.avatar{background:linear-gradient(135deg,#39d98a,#52c7ff 52%,#a879ff);box-shadow:0 14px 30px rgba(38,198,159,.3),inset 0 1px 0 rgba(255,255,255,.8)}

.side-link.active,.side-link:hover{background:linear-gradient(110deg,#27d792,#4fc8ff 55%,#9c78ff);box-shadow:0 12px 24px rgba(63,188,197,.26);transform:translateX(4px)}
.content{position:relative}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(255,255,255,.94),rgba(215,255,235,.9) 42%,rgba(221,240,255,.9) 72%,rgba(244,222,255,.9));border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 50px rgba(57,166,155,.15)}
.hero::before{content:"✦";position:absolute;right:9%;top:10%;font-size:30px;color:#7c5cff;text-shadow:38px 38px #58d8ff,-28px 58px #ffc857;animation:twinkle 3s ease-in-out infinite}
.card,.stat,.table-wrap,.empty{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.92);box-shadow:0 16px 40px rgba(40,113,107,.13)}
.card{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(238,255,247,.79))}

.stat i{color:#078c69}.stat b{color:#173f55}.table-wrap{background:rgba(255,255,255,.86)}

.login-shell::before{content:"🌴";position:fixed;left:4vw;bottom:-22px;font-size:clamp(90px,16vw,190px);opacity:.32;filter:drop-shadow(0 12px 20px rgba(4,120,87,.18));animation:jungleSway 6s ease-in-out infinite;transform-origin:bottom center}
.login-shell::after{content:"🦋";position:fixed;right:9vw;top:15vh;font-size:clamp(38px,6vw,70px);filter:drop-shadow(0 8px 14px rgba(124,92,255,.25));animation:butterfly 6s ease-in-out infinite}
@keyframes jungleFloat{50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes jungleSway{50%{transform:rotate(3deg)}}
@keyframes twinkle{50%{opacity:.35;transform:scale(.82) rotate(12deg)}}
@keyframes butterfly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(-34px,24px) rotate(10deg)}}
