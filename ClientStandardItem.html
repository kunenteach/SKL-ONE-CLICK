<script>
/** Borang skor standard dan penyimpanan item secara pukal. */
async function loadStandards(quiet=false){const useQuiet=quiet===true,year=$('stdYear').value;state.standards=await (useQuiet?serverQuiet:server)('getStandardData',{year});renderStandardRows();selectStandardRecord()}
function selectStandardRecord(){const code=$('stdCode').value,current=state.standards.find(x=>x.standard===code);if(current)populateStandard(current);else resetStandardFields(code)}
function resetStandardFields(code){$('stdId').value='';$('stdScore').value='';$('stdTarget').value=state.initial.defaultTarget;$('stdNote').value='';calcStdStatus()}
function populateStandard(x){$('stdId').value=x.id;$('stdCode').value=x.standard;$('stdScore').value=x.score??'';$('stdTarget').value=x.target;$('stdNote').value=x.note||'';calcStdStatus()}
function calcStdStatus(){const s=Number($('stdScore').value),t=Number($('stdTarget').value);$('stdStatus').value=$('stdScore').value===''?'BELUM DIISI':s>=t?'CAPAI':'BELUM CAPAI'}
function renderStandardRows(){$('stdRows').innerHTML=state.standards.map(x=>`<tr><td>${esc(x.standard)}</td><td>${esc(x.name)}</td><td>${fmt(x.score)}</td><td>${fmt(x.target)}</td><td>${badge(x.status)}</td><td><button class="btn secondary" onclick='populateStandard(${JSON.stringify(x)})'>Edit</button></td></tr>`).join('')}
async function saveStandard(e){e.preventDefault();await server('saveStandardScore',{year:$('stdYear').value,standard:$('stdCode').value,score:$('stdScore').value,target:$('stdTarget').value,note:$('stdNote').value});await refreshAfterSave([()=>loadStandards(true),()=>loadDashboard(true)])}
async function deleteStandard(){const id=$('stdId').value;if(!id||!confirm('Padam markah rekod ini?'))return;await server('deleteStandardScore',id);await loadStandards();await loadDashboard()}

function loadItems(){const y=Number($('itemYear').value),s=$('itemStandard').value,rows=state.items.filter(x=>x.year===y&&x.standard===s).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})),official=state.dashboard?.allStandards?.find(x=>x.year===y&&x.standard===s)?.score;$('itemRows').oninput=calculateItemPercentage;$('itemRows').innerHTML=rows.length?renderItemRowsWithGroups(rows,s):'<tr><td colspan="6">Tiada item ditemui. Jalankan setupSystem() untuk menyelaraskan katalog item.</td></tr>';$('itemOfficialPercentage').value=official??'';calculateItemPercentage()}
function renderItemRowsWithGroups(rows,standard){const groups=(state.initial.itemGroups&&state.initial.itemGroups[standard])||[],out=[];rows.forEach(x=>{const group=groups.find(g=>x.code===g[0]||x.code.startsWith(g[0]+'.'));if(group&&!out.includes('group:'+group[0])){out.push('group:'+group[0],`<tr class="item-group-row"><td><strong>${esc(group[0])}</strong></td><td colspan="5">${esc(group[1])}</td></tr>`)}out.push(`<tr data-id="${esc(x.id)}"><td><strong>${esc(x.code)}</strong></td><td>${esc(x.name)}</td><td><input class="i-score" type="number" min="0" max="100" step=".01" value="${x.score??''}" required aria-label="Skor ${esc(x.code)}"></td><td><input class="i-target" type="number" min="0" max="100" step=".01" value="${x.target||state.initial.defaultTarget}" required aria-label="Sasaran ${esc(x.code)}"></td><td class="i-status">${badge(x.status)}</td><td><input class="i-issue" value="${esc(x.issue)}" aria-label="Isu ${esc(x.code)}"></td></tr>`)});return out.filter(x=>!String(x).startsWith('group:')).join('')}
function calculateItemPercentage(){const rows=[...$('itemRows').querySelectorAll('tr[data-id]')],values=rows.map(r=>r.querySelector('.i-score').value).filter(v=>v!==''),total=rows.length,filled=values.length,percentage=filled?values.reduce((sum,value)=>sum+Number(value),0)/filled:null;$('itemTotal').textContent=total;$('itemFilled').textContent=filled;$('itemPercentage').textContent=percentage==null?'—':percentage.toFixed(2)+'%';$('itemPercentage').className=filled===total&&total?'positive':'yellow';rows.forEach(r=>{const score=r.querySelector('.i-score').value,target=Number(r.querySelector('.i-target').value);r.querySelector('.i-status').innerHTML=score===''?badge('BELUM DIISI'):badge(Number(score)>=target?'CAPAI':'BELUM CAPAI')})}
async function saveItems(e){e.preventDefault();const rows=[...$('itemRows').querySelectorAll('tr[data-id]')],official=$('itemOfficialPercentage').value;if(!rows.length)return toast('Tiada item untuk disimpan.',true);if(rows.some(r=>r.querySelector('.i-score').value===''))return toast('Sila isi skor bagi setiap item sebelum menyimpan.',true);if(official===''||Number(official)<0||Number(official)>100)return toast('Sila isi Peratus Skor Standard antara 0 hingga 100.',true);const items=rows.map(r=>({id:r.dataset.id,score:r.querySelector('.i-score').value,target:r.querySelector('.i-target').value,issue:r.querySelector('.i-issue').value})),result=await server('saveBulkItemScores',{year:$('itemYear').value,standard:$('itemStandard').value,standardPercentage:official,items});items.forEach(input=>{const item=state.items.find(x=>x.id===input.id);if(item){item.score=Number(input.score);item.target=Number(input.target);item.issue=input.issue;item.status=item.score>=item.target?'CAPAI':'BELUM CAPAI'}});$('itemOfficialPercentage').value=Number(result.standardPercentage).toFixed(2);await refreshAfterSave([()=>loadDashboard(true),()=>loadStandards(true)])}
</script>
