<script>
'use strict';
const state={dropdowns:{units:[],levels:[],organisers:[],teachers:[]},page:1,editing:false};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function server(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e))).callServer(name,args));}
function loading(show,text='Sedang diproses…',progress=0){$('#overlay').classList.toggle('hidden',!show);$('#loadingText').textContent=text;$('#progress').value=progress;}
function toast(message,error=false){const t=$('#toast');t.textContent=message;t.className=error?'show error':'show';setTimeout(()=>t.className='',3500);}
function fillSelect(el,items,placeholder='Sila pilih'){el.innerHTML='<option value="">'+placeholder+'</option>'+items.map(v=>`<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join('');}
function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;} function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;');}
document.addEventListener('DOMContentLoaded',init);
async function init(){bindEvents();addImage();loading(true,'Memuatkan sistem…');try{const d=await server('getInitialData');state.dropdowns=d.dropdowns;fillSelect($('#unit'),d.dropdowns.units,'Pilih unit');fillSelect($('#year'),d.dropdowns.years||[],'Pilih tahun');fillSelect($('#filterUnit'),d.dropdowns.units,'Semua Unit');fillSelect($('#level'),d.dropdowns.levels,'Pilih peringkat');fillSelect($('#organiser'),d.dropdowns.organisers,'Pilih anjuran');fillSelect($('#preparedBy'),d.dropdowns.teachers,'Pilih nama guru');addTeacher();const currentYear=String(new Date().getFullYear());if((d.dropdowns.years||[]).includes(currentYear))$('#year').value=currentYear;$('#schoolName').textContent=d.school.name;refreshTeacherOptions();loadSchoolLogo();}catch(e){if(!$('#teachers').children.length)addTeacher();toast(e.message,true);}finally{loading(false);}}
async function loadSchoolLogo(){try{const d=await server('getSchoolLogoData');if(d.logo)$('#brandLogo').innerHTML=`<img alt="Lencana sekolah" src="${d.logo}">`;}catch(e){console.warn('Lencana tidak dapat dimuatkan:',e.message);}}
function bindEvents(){ $$('.nav').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('#menuBtn').onclick=()=>toggleSidebar();$('#sidebarBackdrop').onclick=()=>toggleSidebar(false);window.addEventListener('scroll',()=>$('#appHeader').classList.toggle('scrolled',window.scrollY>16),{passive:true});window.addEventListener('resize',()=>{if(window.innerWidth>900)toggleSidebar(false)},{passive:true});$('#name').oninput=e=>e.target.value=e.target.value.toUpperCase();$('#name').onblur=()=>{if($('#name').value)loadTemplate()};$('#place').onblur=e=>e.target.value=e.target.value.toLowerCase().replace(/(^|\s|[-/])\S/g,c=>c.toUpperCase());$('#date').onchange=updateDay;$('#organiser').onchange=toggleOrganiser;$$('[name=achievementChoice]').forEach(x=>x.onchange=toggleAchievement);$$('[name=guestChoice]').forEach(x=>x.onchange=toggleGuests);$('#addGuest').onclick=()=>addGuest();$('#addTeacher').onclick=()=>addTeacher();$('#addImage').onclick=()=>addImage();$('#previewBtn').onclick=preview;$('#saveBtn').onclick=()=>save(false);$('#pdfBtn').onclick=()=>save(true);$('#resetBtn').onclick=resetForm;$('#newBtn').onclick=()=>{showPage('formPage');resetForm(true)};$('#filterBtn').onclick=()=>{state.page=1;loadHistory()};$('#search').onkeydown=e=>{if(e.key==='Enter')loadHistory()};$('#closePreview').onclick=$('#backEdit').onclick=()=>$('#previewModal').close();$('#previewSave').onclick=()=>save(false);$('#previewPdf').onclick=()=>save(true);$('#printPreview').onclick=()=>$('#previewFrame').contentWindow.print();}
function toggleSidebar(force){const sidebar=$('#sidebar'),open=typeof force==='boolean'?force:!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);$('#sidebarBackdrop').classList.toggle('show',open);$('#menuBtn').setAttribute('aria-expanded',String(open));document.body.style.overflow=open&&window.innerWidth<=900?'hidden':'';}
function showPage(id){$$('.page').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));toggleSidebar(false);if(id==='historyPage')loadHistory();window.scrollTo({top:0,behavior:'smooth'});}
function updateDay(){const v=$('#date').value;if(!v){$('#day').value='';return;}const days=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];$('#day').value=days[new Date(v+'T12:00:00').getDay()];}
async function loadTemplate(){if(!$('#name').value)return;$('#templateLoading').classList.remove('hidden');try{const d=await server('getUnitTemplate','',$('#name').value);['objective1','objective2','impact','improvement'].forEach(k=>$('#'+k).value=d[k]||'');}catch(e){toast(e.message,true)}finally{$('#templateLoading').classList.add('hidden')}}
function toggleOrganiser(){const other=$('#organiser').value.toUpperCase()==='LAIN-LAIN';$('#otherOrganiserWrap').classList.toggle('hidden',!other);$('#otherOrganiser').required=other;if(!other)$('#otherOrganiser').value='';}
function toggleAchievement(){const yes=$('[name=achievementChoice]:checked').value==='yes';$('#achievementWrap').classList.toggle('hidden',!yes);$('#achievement').required=yes;if(!yes)$('#achievement').value='';}
function toggleGuests(){const yes=$('[name=guestChoice]:checked').value==='yes';$('#guestWrap').classList.toggle('hidden',!yes);if(yes&&!$('#guests').children.length)addGuest();if(!yes)$('#guests').innerHTML='';}
function addGuest(g={}){const row=document.createElement('div');row.className='repeat-row guest-row';row.innerHTML=`<label>Nama Penuh<input class="guest-name" value="${escapeAttr(g.name||'')}"></label><label>Jawatan<input class="guest-position" value="${escapeAttr(g.position||'')}"></label><label>Tempat Bertugas<input class="guest-workplace" value="${escapeAttr(g.workplace||'')}"></label><button type="button" class="remove">Padam</button>`;row.querySelector('.remove').onclick=()=>row.remove();$('#guests').append(row);}
function addTeacher(value=''){const row=document.createElement('div');row.className='repeat-row teacher-row';row.innerHTML='<select class="teacher"></select><button type="button" class="remove">Padam</button>';row.querySelector('.teacher').onchange=validateTeacherDuplicates;row.querySelector('.remove').onclick=()=>{if($('#teachers').children.length>1)row.remove();else row.querySelector('select').value='';refreshTeacherOptions()};$('#teachers').append(row);fillSelect(row.querySelector('select'),state.dropdowns.teachers,'Pilih guru');row.querySelector('select').value=value;refreshTeacherOptions();}
function refreshTeacherOptions(){const selected=$$('.teacher').map(x=>x.value).filter(Boolean);$$('.teacher').forEach(sel=>[...sel.options].forEach(o=>{o.disabled=!!o.value&&o.value!==sel.value&&selected.includes(o.value)}));}
function validateTeacherDuplicates(e){const vals=$$('.teacher').map(x=>x.value).filter(Boolean);if(new Set(vals).size!==vals.length){e.target.value='';toast('Nama guru yang sama tidak boleh dipilih dua kali.',true);}refreshTeacherOptions();}
function addImage(existing=null){const card=document.createElement('div');card.className='image-card';card.dataset.fileId=existing?.fileId||'';card.dataset.url=existing?.url||'';card.innerHTML=`<img alt="Pratonton gambar" src="${existing?.data||''}" class="${existing?'':'hidden'}"><label>Pilih Gambar<input class="image-file" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Kapsyen (pilihan)<input class="caption" value="${escapeAttr(existing?.caption||'')}"></label><button type="button" class="remove">Padam Gambar</button>`;const input=card.querySelector('.image-file');input.onchange=async()=>{try{const file=input.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Hanya JPG, PNG dan WEBP dibenarkan.');if(file.size>8*1024*1024)throw new Error('Gambar melebihi 8 MB.');const data=await compressImage(file);card.dataset.data=data;const img=card.querySelector('img');img.src=data;img.classList.remove('hidden');}catch(e){input.value='';toast(e.message,true)}};card.querySelector('.remove').onclick=()=>{if($('#images').children.length>1)card.remove();else{card.dataset.fileId='';card.dataset.data='';input.value='';card.querySelector('img').classList.add('hidden');card.querySelector('.caption').value='';}};$('#images').append(card);}
function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.84));};img.onerror=()=>reject(new Error('Gambar tidak dapat dibaca.'));img.src=url;});}
function collect(){const hasAchievement=$('[name=achievementChoice]:checked').value==='yes',hasGuests=$('[name=guestChoice]:checked').value==='yes';return {unit:$('#unit').value,year:$('#year').value,name:$('#name').value.toUpperCase(),date:$('#date').value,place:$('#place').value,level:$('#level').value,organiser:$('#organiser').value,otherOrganiser:$('#otherOrganiser').value,target:$('#target').value,objective1:$('#objective1').value,objective2:$('#objective2').value,impact:$('#impact').value,hasAchievement,achievement:hasAchievement?$('#achievement').value:'',hasGuests,guests:hasGuests?$$('.guest-row').map(r=>({name:r.querySelector('.guest-name').value,position:r.querySelector('.guest-position').value,workplace:r.querySelector('.guest-workplace').value})):[],improvement:$('#improvement').value,teachers:$$('.teacher').map(x=>x.value).filter(Boolean),preparedBy:$('#preparedBy').value,existingImages:$$('.image-card').filter(x=>x.dataset.fileId).map(x=>({fileId:x.dataset.fileId,url:x.dataset.url,caption:x.querySelector('.caption').value})),images:$$('.image-card').filter(x=>x.dataset.data).map(x=>({data:x.dataset.data,caption:x.querySelector('.caption').value}))};}
function validate(){const form=$('#reportForm');$$('.invalid').forEach(x=>x.classList.remove('invalid'));if(!form.checkValidity()){const bad=form.querySelector(':invalid');bad.classList.add('invalid');bad.focus();toast('Sila lengkapkan semua medan wajib.',true);return false;}if(!$$('.teacher').some(x=>x.value)){toast('Sila pilih sekurang-kurangnya seorang guru.',true);return false;}return true;}
async function preview(){if(!validate())return;loading(true,'Menyediakan pratonton…');try{const r=await server('generatePreview',collect());const doc=$('#previewFrame').contentDocument;doc.open();doc.write(r.html);doc.close();$('#previewModal').showModal();}catch(e){toast(e.message,true)}finally{loading(false)}}
async function save(makePdf){if(!validate())return;loading(true,'Menyimpan laporan…',20);try{let r;const id=$('#reportId').value;if(id)r=await server('updateReport',id,collect());else r=await server('saveReport',collect());$('#reportId').value=r.id;state.editing=true;loading(true,makePdf?'Menjana PDF…':'Laporan berjaya disimpan.',makePdf?65:100);toast('Laporan berjaya disimpan.');if(makePdf){const pdf=await server('generateReportPdf',r.id);toast('PDF berjaya dijana.');window.open(pdf.url,'_blank');}if($('#previewModal').open)$('#previewModal').close();}catch(e){toast(e.message,true)}finally{loading(false)}}
function resetForm(force=false){if(!force&&!confirm('Kosongkan semua data borang?'))return;$('#reportForm').reset();const currentYear=String(new Date().getFullYear());if([...$('#year').options].some(option=>option.value===currentYear))$('#year').value=currentYear;$('#reportId').value='';$('#guests').innerHTML='';$('#teachers').innerHTML='';$('#images').innerHTML='';addTeacher();addImage();toggleOrganiser();toggleAchievement();toggleGuests();state.editing=false;toast('Borang telah dikosongkan.');}
async function loadHistory(){const list=$('#historyList');list.innerHTML='<div class="hint">Memuatkan laporan…</div>';try{const r=await server('getReportHistory',{query:$('#search').value,unit:$('#filterUnit').value,date:$('#filterDate').value,page:state.page});list.innerHTML=r.items.length?r.items.map(historyCard).join(''):'<div class="hint">Tiada laporan ditemui.</div>';bindHistory();renderPagination(r);}catch(e){list.innerHTML='';toast(e.message,true)}}
function historyCard(r){return `<article class="report-card" data-id="${escapeAttr(r.id)}"><div><span class="meta">${escapeHtml(r.id)} · ${escapeHtml(r.formattedDate)} (${escapeHtml(r.day)})</span><h3>${escapeHtml(r.name)}</h3><div class="meta">${escapeHtml(r.unit)} · Disediakan oleh ${escapeHtml(r.preparedBy)} · Disimpan ${escapeHtml(r.savedAt)}</div></div><div class="card-actions"><button data-action="view">Lihat</button><button data-action="edit">Edit</button><button data-action="pdf">Jana PDF</button>${r.pdfUrl?`<a href="${escapeAttr(r.pdfUrl)}" target="_blank">Muat Turun</a>`:''}<button class="delete" data-action="delete" data-name="${escapeAttr(r.name)}">Padam</button></div></article>`;}
function bindHistory(){$$('.report-card button').forEach(b=>b.onclick=async()=>{const card=b.closest('.report-card'),id=card.dataset.id,action=b.dataset.action;if(action==='delete'){if(!confirm(`Padam laporan “${b.dataset.name}”? Fail berkaitan akan dialihkan ke tong sampah.`))return;loading(true,'Memadam laporan…');try{await server('deleteReport',id);toast('Laporan berjaya dipadam.');loadHistory();}catch(e){toast(e.message,true)}finally{loading(false)}return;}if(action==='pdf'){loading(true,'Menjana PDF…');try{const p=await server('generateReportPdf',id);window.open(p.url,'_blank');toast('PDF berjaya dijana.');loadHistory();}catch(e){toast(e.message,true)}finally{loading(false)}return;}loading(true,'Membuka laporan…');try{const r=await server('getReportById',id);await populate(r);if(action==='view')await preview();else showPage('formPage');}catch(e){toast(e.message,true)}finally{loading(false)}})}
function renderPagination(r){$('#pagination').innerHTML=Array.from({length:r.totalPages},(_,i)=>`<button class="${i+1===r.page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');$$('#pagination button').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);loadHistory()});}
async function populate(r){resetForm(true);$('#reportId').value=r.id;['unit','year','name','date','place','level','organiser','otherOrganiser','target','objective1','objective2','impact','achievement','improvement','preparedBy'].forEach(k=>$('#'+k).value=r[k]??'');updateDay();$$(`[name=achievementChoice]`).forEach(x=>x.checked=x.value===(r.hasAchievement?'yes':'no'));$$(`[name=guestChoice]`).forEach(x=>x.checked=x.value===(r.hasGuests?'yes':'no'));toggleAchievement();toggleGuests();$('#guests').innerHTML='';(r.guests||[]).forEach(addGuest);$('#teachers').innerHTML='';(r.teachers||[]).forEach(addTeacher);$('#images').innerHTML='';(r.images||[]).forEach(addImage);if(!r.images?.length)addImage();toggleOrganiser();state.editing=true;}
</script>
