<script>
const App={data:null,page:'home',managementOpen:true,collapsed:false,sessionToken:''};
const icons={home:'⌂',strength:'◇',management:'▣',placeholder:'□',pps:'♙',standard:'▤'};
const navItems=[{id:'home',label:'Utama',icon:icons.home},{id:'strength',label:'Kekuatan Kami',icon:icons.strength},{id:'management',label:'Pengurusan Kami',icon:icons.management,children:[{id:'pps',label:'Agihan kepada PPS'},{id:'evidence',label:'Pengisian Evidens'},{id:'STD1',label:'Standard 1'},{id:'STD2',label:'Standard 2'},{id:'STD31',label:'Standard 3.1',sub:'Kurikulum'},{id:'STD32',label:'Standard 3.2',sub:'Kokurikulum'},{id:'STD33',label:'Standard 3.3',sub:'Hal Ehwal Murid'}]},{id:'component4',label:'Komponen Ke-4',icon:icons.placeholder},{id:'component5',label:'Komponen Ke-5',icon:icons.placeholder}];
document.getElementById('loginForm').addEventListener('submit',authenticateLogin);
document.getElementById('togglePassword').addEventListener('click',togglePasswordVisibility);
document.getElementById('logoutBtn').onclick=logoutApplication;
document.getElementById('collapseBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('collapsed');
document.getElementById('menuBtn').onclick=()=>toggleMobile(true);document.getElementById('overlay').onclick=()=>{toggleMobile(false);closeDrawer()};
function authenticateLogin(event){event.preventDefault();const password=document.getElementById('loginPassword'),button=document.getElementById('loginButton'),error=document.getElementById('loginError');error.textContent='';button.disabled=true;button.innerHTML='MENGESAHKAN... <span>···</span>';if(!(window.google&&google.script&&google.script.run)){error.textContent='Login hanya tersedia melalui deployment Google Apps Script.';resetLoginButton();return}google.script.run.withSuccessHandler(bundle=>{App.sessionToken=bundle.token;password.value='';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');resetLoginButton();init(bundle.data)}).withFailureHandler(failure=>{error.textContent=failure&&failure.message?failure.message:'Log masuk gagal. Sila cuba semula.';password.select();resetLoginButton()}).authenticateWithPassword(password.value)}
function resetLoginButton(){const button=document.getElementById('loginButton');button.disabled=false;button.innerHTML='LOG MASUK <span>→</span>'}
function togglePasswordVisibility(){const input=document.getElementById('loginPassword'),button=document.getElementById('togglePassword'),visible=input.type==='text';input.type=visible?'password':'text';button.textContent=visible?'LIHAT':'SOROK';button.setAttribute('aria-label',visible?'Lihat kata laluan':'Sorok kata laluan');button.setAttribute('aria-pressed',String(!visible));input.focus()}
function logoutApplication(){const token=App.sessionToken;App.sessionToken='';App.data=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('loginPassword').focus();if(token&&window.google&&google.script&&google.script.run)google.script.run.logoutAppSession(token)}
function init(data){App.data=data;document.getElementById('userName').textContent=data.user.nama||'Pentadbir Sekolah';renderNav();navigate('home')}
function renderNav(){document.getElementById('nav').innerHTML='<p class="nav-label">5 KOMPONEN UTAMA</p>'+navItems.map(item=>`<div><button class="nav-item ${App.page===item.id?'active':''}" data-page="${item.id}" title="${item.label}"><span class="nav-icon">${item.icon}</span><span>${item.label}</span>${item.children?'<span class="chev">⌄</span>':''}</button>${item.children&&App.managementOpen?`<div class="submenu">${item.children.map(c=>`<button class="sub-item ${App.page===c.id?'active':''}" data-page="${c.id}"><span>${c.label}${c.sub?`<small>${c.sub}</small>`:''}</span></button>`).join('')}</div>`:''}</div>`).join('');document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>navigate(button.dataset.page))}
function navigate(page){if(page==='management'){App.managementOpen=!App.managementOpen;page='pps'}App.page=page;renderNav();toggleMobile(false);if(page==='home')renderHome();else if(page==='strength')renderStrength();else if(page==='pps')renderPps();else if(page.startsWith('STD'))renderStandard(page);else renderPlaceholder(page)}
function pageHead(kicker,title,desc){return `<div class="page-head"><div><p class="eyebrow">${kicker}</p><h2>${title}</h2><p>${desc}</p></div><span class="phase-tag">STRUKTUR PHASE 1</span></div>`}
function metrics(){const aspects=App.data.standards.flatMap(s=>s.aspects||[]), evidence=aspects.flatMap(a=>a.evidence||[]), complete=evidence.filter(e=>e.status==='LENGKAP').length;return {aspects:aspects.length,evidence:evidence.length,complete,incomplete:evidence.length-complete,percent:evidence.length?Math.round(complete/evidence.length*100):0}}
function renderHome(){const m=metrics(),stats=[['Jumlah Standard',App.data.standards.length,'Standard aktif'],['Jumlah Aspek',m.aspects,'Berdasarkan data rasmi'],['Jumlah Evidens',m.evidence,'Rekod keseluruhan'],['Evidens Lengkap',m.complete,'Disahkan lengkap'],['Belum Lengkap',m.incomplete,'Perlu tindakan'],['Kelengkapan',m.percent+'%','Kemajuan semasa']];document.getElementById('content').innerHTML=pageHead('UTAMA · PROFIL INSTITUSI',App.data.config.schoolName,'Pusat kawalan pengurusan kualiti dan pengumpulan evidens institusi.')+`<section class="stats">${stats.map(s=>`<article class="stat"><small>${s[0]}</small><strong>${s[1]}</strong><em>${s[2]}</em></article>`).join('')}</section><section class="grid"><article class="panel"><div class="panel-head"><h3>Kemajuan Evidens Mengikut Standard</h3><small>Dikemas kini automatik</small></div>${App.data.standards.map(s=>progress(s.name,standardPercent(s))).join('')}</article><article class="panel"><div class="panel-head"><h3>Aktiviti Terkini</h3><small>Audit trail</small></div>${activityHtml()}</article></section><section class="profile-grid"><article class="panel"><h3>Maklumat Asas</h3>${placeholderLines()}</article><article class="panel"><h3>Program Pendidikan</h3>${placeholderLines()}</article><article class="panel"><h3>Label Institusi</h3><div class="empty"><p>Label institusi belum dikonfigurasi.</p></div></article></section>`}
function progress(label,value){return `<div class="progress-row"><span>${label}</span><div class="track"><div class="fill" style="width:${value}%"></div></div><b>${value}%</b></div>`}function standardPercent(s){const ev=(s.aspects||[]).flatMap(a=>a.evidence||[]);return ev.length?Math.round(ev.filter(e=>e.status==='LENGKAP').length/ev.length*100):0}function placeholderLines(){return '<div class="placeholder-line"></div><div class="placeholder-line"></div><div class="placeholder-line"></div>'}function activityHtml(){return App.data.activities.length?App.data.activities.map(a=>`<p>${escapeHtml(a.action||'Aktiviti')}</p>`).join(''):'<div class="activity-empty"><div><div class="empty-icon">↻</div><p>Aktiviti akan dipaparkan selepas data mula dikemaskini.</p></div></div>'}
function emptyState(message){return `<div class="empty"><div><div class="empty-icon">◇</div><h3>DATA ASPEK BELUM DIMASUKKAN</h3><p>${message||'Senarai aspek akan dipaparkan selepas data Standard Kualiti @ Sekolah dimasukkan.'}</p></div></div>`}
function renderStrength(){const complete=App.data.strengths.filter(x=>x.status==='LENGKAP').length,p=Math.round(complete/9*100);document.getElementById('content').innerHTML=pageHead('KOMPONEN 2','Kekuatan Kami','Pengurusan sembilan aspek kekuatan institusi.')+`<article class="panel"><div class="panel-head"><div><h3>${complete} / 9 Aspek Lengkap</h3><small>Menunggu data rasmi daripada screenshot</small></div><strong>${p}%</strong></div>${progress('Kemajuan',p)}${App.data.strengths.length?'':emptyState('Sembilan aspek Kekuatan Kami akan dipaparkan di sini selepas data rasmi dimasukkan.')}</article>`}
function toolbar(){return `<div class="toolbar"><label class="search"><span>⌕</span><input class="field" id="tableSearch" placeholder="Cari aspek atau evidens..."></label><select class="field filter"><option>Semua Status</option><option>Belum Lengkap</option><option>Dalam Proses</option><option>Lengkap</option></select><select class="field filter"><option>Semua Lokasi</option><option>Fail Fizikal</option><option>Upload</option></select></div>`}
function tableShell(type){return `<div class="table-wrap"><table><thead><tr>${type==='pps'?'<th>STANDARD</th><th>NO ASPEK</th><th>NAMA ASPEK</th><th>PPS</th><th>STATUS</th><th>TINDAKAN</th>':'<th>NO ASPEK</th><th>NAMA ASPEK</th><th>NAMA EVIDENS</th><th>LOKASI EVIDENS</th><th>STATUS</th><th>TINDAKAN</th>'}</tr></thead><tbody></tbody></table>${emptyState(type==='pps'?'Format agihan PPS akan dipaparkan selepas screenshot rasmi diterima.':null)}</div>`}
function renderPps(){document.getElementById('content').innerHTML=pageHead('PENGURUSAN KAMI','Agihan Kepada PPS','Agih dan pantau tanggungjawab Pegawai Penyelaras Standard.')+toolbar()+tableShell('pps')}
function renderStandard(id){const s=App.data.standards.find(x=>x.id===id),pct=standardPercent(s),total=(s.aspects||[]).length;document.getElementById('content').innerHTML=pageHead('PENGURUSAN KAMI',`${s.name}${s.subtitle?' — '+s.subtitle.toUpperCase():''}`,'Pengurusan aspek, evidens dan lokasi penyimpanan.')+`<article class="panel"><div class="panel-head"><div><h3>Ringkasan Standard</h3><small>${total} aspek · 0 evidens lengkap</small></div><div class="standard-summary"><strong>${pct}%</strong><button class="btn primary" id="addEvidence">+ TAMBAH EVIDENS</button></div></div>${progress('Kelengkapan',pct)}</article>`+toolbar()+tableShell('standard');document.getElementById('addEvidence').onclick=()=>openEvidenceDrawer(s)}
function openEvidenceDrawer(s){const d=document.getElementById('drawer');d.innerHTML=`<div class="panel-head"><div><p class="eyebrow">${s.name}</p><h2>Tambah Evidens</h2></div><button class="icon-btn" id="closeDrawer">×</button></div><label>Nama Evidens<input class="field" placeholder="Masukkan nama evidens"></label><p class="eyebrow">LOKASI EVIDENS</p><div class="segmented"><button class="active">FAIL FIZIKAL</button><button>UPLOAD</button></div><label>Nama Fail / Lokasi Fail<input class="field" placeholder="Contoh: Fail Pengurusan Standard"></label><label>No. Divider / Bahagian<input class="field" placeholder="Contoh: 1.2"></label><label>Catatan<textarea class="field" rows="4"></textarea></label><button class="btn primary" style="width:100%;margin-top:18px" id="demoSave">SIMPAN PERUBAHAN</button>`;d.classList.add('open');d.setAttribute('aria-hidden','false');document.getElementById('overlay').classList.add('open');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('demoSave').onclick=()=>showToast('Data aspek rasmi diperlukan sebelum evidens boleh disimpan.');d.querySelectorAll('.segmented button').forEach(b=>b.onclick=()=>{d.querySelectorAll('.segmented button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast(b.textContent==='UPLOAD'?'Komponen muat naik sedia untuk sambungan Drive.':'Lokasi fail fizikal dipilih.')})}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open')}function renderPlaceholder(id){document.getElementById('content').innerHTML=pageHead('KOMPONEN PLACEHOLDER',id==='component4'?'Komponen Ke-4':'Komponen Ke-5','Ruang ini disediakan untuk konfigurasi kandungan pada fasa seterusnya.')+`<article class="panel">${emptyState('Kandungan belum ditetapkan. Tiada data rekaan dipaparkan.')}</article>`}function renderSkeleton(){document.getElementById('content').innerHTML='<section class="stats">'+Array(6).fill('<article class="stat">'+placeholderLines()+'</article>').join('')+'</section>'}function toggleMobile(open){document.getElementById('sidebar').classList.toggle('mobile-open',open);document.getElementById('overlay').classList.toggle('open',open)}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}function handleError(error){showToast(error&&error.message?'Tidak dapat memuatkan sistem: '+error.message:'Ralat rangkaian. Sila cuba semula.')}function escapeHtml(value){const d=document.createElement('div');d.textContent=value;return d.innerHTML}
</script>
