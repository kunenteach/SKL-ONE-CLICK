<script>
'use strict';
const state={initial:null,dashboard:null,standards:[],items:[],actions:[],documents:[],entryLinks:[],charts:{},lowItems:[],authToken:''};
const DEFAULT_SCHOOL_LOGO_URL='https://lh3.googleusercontent.com/d/1byIjETieWJNW1XYMzIYmoDZLh_4MNubc=w400';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=n=>n==null||!Number.isFinite(Number(n))?'—':Number(n).toFixed(2)+'%';
function loading(show=true){$('loading').classList.toggle('hidden',!show)}
function toast(message,error=false){const el=$('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),4200)}
function server(name,...args){return callServer(name,{toastSuccess:true,toastError:true},...addAuth(args))}
function addAuth(args){if(!state.authToken)return args;const next=args.slice();if(next.length&&next[0]&&typeof next[0]==='object'&&!Array.isArray(next[0]))next[0]={...next[0],_authToken:state.authToken};else next[0]={value:next[0],_authToken:state.authToken};return next}
function serverQuiet(name,...args){return callServer(name,{toastSuccess:false,toastError:false},...addAuth(args))}
function callServer(name,options,...args){loading(true);return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(r=>{loading(false);if(!r||!r.success){const msg=r?.error?`${r.message||'Operasi gagal.'} ${r.error}`:(r?.message||'Operasi gagal.');if(options.toastError)toast(msg,true);reject(new Error(msg));return}resolve(r.data);if(options.toastSuccess&&r.message)toast(r.message)}).withFailureHandler(e=>{loading(false);const msg=e&&e.message?e.message:'Ralat pelayan tanpa mesej. Buka Apps Script Executions untuk butiran.';if(options.toastError)toast(msg,true);reject(new Error(msg))})[name](...args)})}
async function refreshAfterSave(tasks){const results=await Promise.allSettled(tasks.map(task=>task()));if(results.some(r=>r.status==='rejected'))toast('Data telah disimpan, tetapi paparan selepas simpan gagal disegarkan. Sila refresh halaman atau buka Dashboard semula.',true)}
function option(value,label){return `<option value="${esc(value)}">${esc(label)}</option>`}
function fillSelect(id,entries,allLabel){const el=$(id);if(!el)return;el.innerHTML=(allLabel!=null?option('',allLabel):'')+entries.map(x=>option(x.value,x.label)).join('')}
function badge(status){const s=String(status||'');return `<span class="badge ${s==='CAPAI'||s==='SELESAI'||s==='TELAH DILAKSANAKAN'?'success':s==='BELUM CAPAI'||s==='BELUM DILAKSANAKAN'?'danger':'warning'}">${esc(s)}</span>`}
function dateValue(v){if(!v)return '';const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10)}
function destroyChart(name){if(state.charts[name]){state.charts[name].destroy();delete state.charts[name]}}
const chartDefaults={color:'#94a3b8',borderColor:'#24344d'};
function chart(name,canvas,config){destroyChart(name);Chart.defaults.color=chartDefaults.color;Chart.defaults.borderColor=chartDefaults.borderColor;state.charts[name]=new Chart($(canvas),config)}

document.addEventListener('DOMContentLoaded',()=>{loading(false);$('loginButton').addEventListener('click',login);$('passwordLoginForm').addEventListener('submit',loginPassword)});
async function login(){
  $('loginError').classList.add('hidden');
  try{init(await server('getInitialData'))}
  catch(error){$('loginError').textContent=error.message||'Log masuk gagal. Sila cuba lagi.';$('loginError').classList.remove('hidden')}
}
async function loginPassword(e){e.preventDefault();$('loginError').classList.add('hidden');try{init(await server('loginWithPassword',{password:$('loginPassword').value}))}catch(error){$('loginError').textContent=error.message||'Log masuk gagal.';$('loginError').classList.remove('hidden')}}
function init(data){state.initial=data;state.authToken=data.authToken||'';state.items=data.items;$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('schoolName').textContent=data.settings.NAMA_SEKOLAH||'SEKOLAH KEBANGSAAN LORMALONG';$('appTitle').textContent=data.settings.TAJUK_SISTEM||'DASHBOARD STANDARD KUALITI @ SEKOLAH';$('appVersion').textContent=`v${data.appVersion}`;$('userName').textContent=data.user.name;$('userRole').textContent=`${data.user.role} • ${data.user.email}`;$('fileLimit').textContent=`Format: PDF, DOC(X), XLS(X), JPG, PNG. Maksimum ${data.maxFileMb} MB.`;
  const logoUrl=data.settings.LOGO_URL||data.logoUrl||DEFAULT_SCHOOL_LOGO_URL;if(logoUrl){$('schoolLogo').onerror=()=>{if($('schoolLogo').src!==DEFAULT_SCHOOL_LOGO_URL)$('schoolLogo').src=DEFAULT_SCHOOL_LOGO_URL;else{$('schoolLogo').classList.add('hidden');$('logoFallback').classList.remove('hidden')}};$('schoolLogo').src=logoUrl;$('schoolLogo').classList.remove('hidden');$('logoFallback').classList.add('hidden')}
  if(data.user.role!=='ADMIN')document.querySelectorAll('.admin-only').forEach(x=>x.classList.add('hidden'));
  const years=data.years.map(y=>({value:y,label:y})), standards=data.standards.map(s=>({value:s.code,label:`${s.code} — ${s.name}`}));
  ['globalYear','stdYear','itemYear','actYear','docYear','entryLinkYear','anaStart','anaEnd'].forEach(id=>fillSelect(id,years));
  ['stdCode','itemStandard','actStandard','anaStandard'].forEach(id=>fillSelect(id,standards,id==='anaStandard'?'Semua Standard':'Pilih standard'));
  fillSelect('docCategory',data.categories.map(x=>({value:x,label:x})));fillSelect('actStatus',data.actionStatuses.map(x=>({value:x,label:x})));
  if(years.length){document.querySelectorAll('select[id$="Year"],#globalYear,#anaStart,#anaEnd').forEach(s=>s.value=years.at(-1).value);$('anaStart').value=years[0].value}
  $('stdTarget').value=$('actLimit').value=$('setTarget').value=data.defaultTarget;$('setSchool').value=data.settings.NAMA_SEKOLAH||'';$('setLogo').value=data.settings.LOGO_URL||'';
  bindEvents();loadDashboard();loadStandards();loadActions();loadDocuments();
}
function bindEvents(){document.querySelectorAll('.nav[data-page]').forEach(n=>n.onclick=()=>showPage(n.dataset.page));$('sidebarAddYear').onclick=openYearModal;$('inlineAddYear').onclick=openYearModal;$('menuBtn').onclick=toggleMenu;$('scrim').onclick=toggleMenu;$('globalYear').onchange=()=>{loadDashboard();syncYear($('globalYear').value)};$('tableSearch').oninput=renderAnalysisTable;
  $('stdCode').onchange=selectStandardRecord;$('stdYear').onchange=()=>loadStandards();$('stdScore').oninput=calcStdStatus;$('stdTarget').oninput=calcStdStatus;$('standardForm').onsubmit=saveStandard;$('stdDelete').onclick=deleteStandard;
  $('loadItems').onclick=loadItems;$('itemForm').onsubmit=saveItems;$('runAnalysis').onclick=runAnnual;$('findItems').onclick=findLowItems;$('actItem').onchange=selectLowItem;$('actionForm').onsubmit=saveAction;$('openActionEditor').onclick=()=>openActionEditor(false);$('closeActionEditor').onclick=closeActionEditor;$('cancelActionEditor').onclick=closeActionEditor;
  $('documentForm').onsubmit=uploadDocument;$('refreshDocs').onclick=loadDocuments;$('openDocumentEditor').onclick=openDocumentEditor;$('closeDocumentEditor').onclick=closeDocumentEditor;$('cancelDocumentEditor').onclick=closeDocumentEditor;$('applyDocumentFilters').onclick=renderDocuments;$('resetDocumentFilters').onclick=resetDocumentFilters;$('yearForm').onsubmit=generateYear;$('settingsForm').onsubmit=saveSettings;$('userForm').onsubmit=saveUser;
  $('entryLinkForm').onsubmit=saveEntryLink;$('refreshEntryLinks').onclick=loadEntryLinks;$('openEntryLinkEditor').onclick=openEntryLinkEditor;$('closeEntryLinkEditor').onclick=closeEntryLinkEditor;$('cancelEntryLinkEditor').onclick=closeEntryLinkEditor;
  $('quickAddYear').onclick=openYearModal;$('closeYearModal').onclick=closeYearModal;$('cancelYearModal').onclick=closeYearModal;$('quickYearForm').onsubmit=generateYear;$('yearModal').onclick=e=>{if(e.target===$('yearModal'))closeYearModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeYearModal()});
}
function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${page}`));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(innerWidth<781)toggleMenu();if(page==='analysis')runAnnual();if(page==='action')loadActions();if(page==='documents')loadDocuments();if(page==='entry-links')loadEntryLinks()}
function toggleMenu(){$('sidebar').classList.toggle('open');$('scrim').classList.toggle('open')}
function syncYear(y){['stdYear','itemYear','actYear','docYear','entryLinkYear','anaEnd'].forEach(id=>{if($(id))$(id).value=y})}
function openYearModal(){const latest=Math.max(...state.initial.years.map(Number),new Date().getFullYear());$('quickNewYear').value=latest+1;$('yearModal').classList.remove('hidden');setTimeout(()=>$('quickNewYear').focus(),0)}
function closeYearModal(){$('yearModal').classList.add('hidden');$('quickYearForm').reset()}
</script>
