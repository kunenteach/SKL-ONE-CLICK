<script>
const App={token:'',type:'',user:null,data:{},charts:{},currentSession:null,timer:null,seconds:0};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function call(fn,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message?err.message:String(err||'Ralat sambungan Apps Script.'))))[fn](...args);});}
function toast(msg,type='success'){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toast').appendChild(el);setTimeout(()=>el.remove(),4200)}
function show(view){$$('.view').forEach(v=>v.classList.remove('active'));$('#'+view).classList.add('active')}
function fillSettings(s){document.documentElement.style.setProperty('--primary',s.PRIMARY_COLOR||'#8ec5ff');document.documentElement.style.setProperty('--secondary',s.SECONDARY_COLOR||'#c8b6ff');$$('[data-setting="DASHBOARD_NAME"]').forEach(e=>e.textContent=s.DASHBOARD_NAME||'iGEMKIDS');$$('[data-setting="DASHBOARD_SUBTITLE"]').forEach(e=>e.textContent=s.DASHBOARD_SUBTITLE||'PRA PINTAR SKL');if(s.LOGO_URL){$('#loginLogo').innerHTML='<img alt="Logo" src="'+esc(s.LOGO_URL)+'">'}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formObj(form){return Object.fromEntries(new FormData(form).entries())}
function duration(sec){sec=Number(sec)||0;return Math.floor(sec/60)+'m '+(sec%60)+'s'}
document.addEventListener('DOMContentLoaded',init);
async function init(){try{fillSettings(await call('getSystemSettings'))}catch(e){} bindLogin(); bindNav(); bindForms(); window.addEventListener('message',onGameMessage);}
function bindLogin(){ $$('.tab').forEach(b=>b.onclick=()=>{$$('.tab,.tab-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')}); $$('[data-toggle-password]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.togglePassword);i.type=i.type==='password'?'text':'password'}); $('#studentLogin').onsubmit=e=>handleLogin_(e,'student'); $('#teacherLogin').onsubmit=e=>handleLogin_(e,'teacher'); $$('[data-logout]').forEach(b=>b.onclick=async()=>{await call('logoutUser',App.token); location.reload()});}
async function handleLogin_(event,type){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),original=button.innerHTML;button.disabled=true;button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> MEMUATKAN...';try{const r=type==='student'?await call('loginStudent',$('#studentPassword').value,navigator.userAgent):await call('loginTeacher',$('#teacherUsername').value,$('#teacherPassword').value,navigator.userAgent);if(!r||!r.success)throw new Error((r&&r.message)||'Login gagal tanpa respons.');Object.assign(App,{token:r.data.token,type:r.data.type||type,user:r.data.user});show(type==='student'?'parentView':'teacherView');toast(r.message);if(type==='student')await loadParent();else await loadTeacher();}catch(error){console.error('iGEMKIDS login failed',error);show('loginView');toast('Login tidak dapat dibuka: '+error.message,'error');}finally{button.disabled=false;button.innerHTML=original;}}
function bindNav(){ $$('.hamburger').forEach(b=>b.onclick=()=>b.closest('.app-shell').querySelector('.sidebar').classList.toggle('open')); $$('[data-parent-page]').forEach(b=>b.onclick=()=>switchPage('parent',b.dataset.parentPage,b)); $$('[data-teacher-page]').forEach(b=>b.onclick=()=>switchPage('teacher',b.dataset.teacherPage,b)); $('#backToGames').onclick=()=>show(App.type==='teacher'?'teacherView':'parentView'); $('#replayGame').onclick=()=>App.currentSession&&openGame(App.currentSession.game,App.currentSession.student.STUDENT_ID); $('#finishGame').onclick=finishGame; ['gameSearch','fieldFilter','standardFilter','statusFilter','difficultyFilter'].forEach(id=>$('#'+id)?.addEventListener('input',renderGameGroups));}
function switchPage(scope,id,btn){Array.from(btn.closest('.sidebar').querySelectorAll('.side-link')).forEach(x=>x.classList.remove('active'));btn.classList.add('active');Array.from(btn.closest('.app-shell').querySelectorAll('.page')).forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function stat(label,value,icon='fa-star'){return `<div class="stat"><i class="fa-solid ${icon}"></i><span>${label}</span><b>${esc(value)}</b></div>`}
async function loadParent(){show('parentView'); const r=await call('getStudentDashboard',App.token); if(!r.success)return toast(r.message,'error'); App.data=r.data; fillSettings(r.data.settings); $('#parentName').textContent='Selamat Datang, '+r.data.student.STUDENT_NAME; $('#parentClass').textContent='Kelas: '+r.data.student.CLASS; $('#heroStudent').textContent=r.data.student.STUDENT_NAME; $('#todayDate').textContent=new Date().toLocaleDateString('ms-MY',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); $('#welcomeMessage').textContent=r.data.settings.WELCOME_MESSAGE; renderAssignments(); renderStudentStats(); renderActivity(); setupGameFilters(); renderFields(); renderGameGroups(); drawStudentCharts();}
function renderAssignments(){const list=App.data.todayAssignments||[]; $('#todayAssignments').innerHTML=list.length?list.map(gameCard).join(''):'<div class="empty">Tiada permainan ditetapkan untuk hari ini.</div>'; bindPlayButtons()}
function gameCard(g){return `<div class="card"><div class="badge">${esc(g.STANDARD_CODE||'SP')}</div><h3>${esc(g.GAME_NAME)}</h3><p>${esc(g.FIELD_NAME)}</p><p>${esc(g.STANDARD_DESCRIPTION||'')}</p><p><b>${esc(g.DIFFICULTY||'Mudah')}</b> • ${esc(g.ESTIMATED_TIME||'10 minit')}</p><p>Status: <span class="badge">${esc(g.PLAY_STATUS||'Belum dimainkan')}</span></p><button class="primary play" data-game="${esc(g.GAME_ID)}">${g.PLAY_STATUS==='Selesai'?'MAIN SEMULA':'MULA BERMAIN'}</button></div>`}
function renderStudentStats(){const s=App.data.summary||{}; $('#studentStats').innerHTML=[stat('Kedudukan Saya',s.rank||'-','fa-ranking-star'),stat('Jumlah Markah',s.totalScore||0,'fa-trophy'),stat('Permainan Selesai',s.completed||0,'fa-circle-check'),stat('Purata Markah',s.averageScore||0,'fa-chart-simple')].join('')}
function renderActivity(){const rows=App.data.recentResults||[]; $('#studentActivity').innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.PLAY_DATE)}</td><td>${esc(r.START_TIME)}</td><td>${esc(r.END_TIME)}</td><td>${duration(r.DURATION_SECONDS)}</td><td>${esc(r.GAME_NAME)}</td><td>${esc(r.FIELD_NAME)}</td><td>${esc(r.STANDARD_CODE)}</td><td>${esc(r.SCORE)}/${esc(r.MAX_SCORE)}</td><td>${esc(r.RESULT_STATUS)}</td><td>${esc(r.ATTEMPT_NUMBER)}</td></tr>`).join(''):'<tr><td colspan="10" class="empty">Belum ada aktiviti.</td></tr>'}
function setupGameFilters(){const fields=App.data.fields||[], standards=App.data.standards||[]; $('#fieldFilter').innerHTML='<option value="">Semua bidang</option>'+fields.map(f=>`<option value="${f.FIELD_ID}">${esc(f.FIELD_NAME)}</option>`).join(''); $('#standardFilter').innerHTML='<option value="">Semua Standard</option>'+standards.map(s=>`<option value="${s.STANDARD_ID}">${esc(s.STANDARD_CODE)} — ${esc(s.STANDARD_DESCRIPTION)}</option>`).join('')}
function renderFields(){const games=App.data.games||[]; $('#fieldCards').innerHTML=(App.data.fields||[]).map(f=>`<div class="card" style="border-top:8px solid ${esc(f.FIELD_COLOR)}"><i class="fa-solid ${esc(f.FIELD_ICON)} hero-icon"></i><h3>${esc(f.FIELD_NAME)}</h3><p>${games.filter(g=>g.FIELD_ID===f.FIELD_ID).length} permainan tersedia</p><button class="ghost" onclick="document.querySelector('#fieldFilter').value='${f.FIELD_ID}';renderGameGroups()">Lihat Bidang</button></div>`).join('')}
function renderGameGroups(){let games=[...(App.data.games||[])], q=($('#gameSearch')?.value||'').toLowerCase(), f=$('#fieldFilter')?.value, st=$('#standardFilter')?.value, status=$('#statusFilter')?.value, diff=$('#difficultyFilter')?.value; games=games.filter(g=>(!q||g.GAME_NAME.toLowerCase().includes(q))&&(!f||g.FIELD_ID===f)&&(!st||g.STANDARD_ID===st)&&(!status||g.PLAY_STATUS===status)&&(!diff||g.DIFFICULTY===diff)); const grouped=games.reduce((m,g)=>{const k=g.STANDARD_CODE+'|'+g.STANDARD_DESCRIPTION;(m[k]=m[k]||[]).push(g);return m},{}); $('#gameGroups').innerHTML=Object.keys(grouped).length?Object.entries(grouped).map(([k,gs])=>{const [code,desc]=k.split('|');return `<section class="card"><h2>${esc(code)}</h2><p>${esc(desc)}</p><div class="grid cards">${gs.map(gameCard).join('')}</div></section>`}).join(''):'<div class="empty">Tiada permainan ditemui.</div>'; bindPlayButtons()}
function bindPlayButtons(){$$('.play').forEach(b=>b.onclick=()=>{const g=(App.data.games||[]).find(x=>x.GAME_ID===b.dataset.game); openGame(g, App.type==='student'?App.user.STUDENT_ID:($('#teacherStudentSelect').value||''))})}
async function openGame(game,studentId){if(!studentId)return toast('Sila pilih nama murid terlebih dahulu.','error'); const r=await call('startGameSession',game.GAME_ID,App.token,studentId); if(!r.success)return toast(r.message,'error'); App.currentSession=r.data; $('#playGameName').textContent=game.GAME_NAME; $('#playMeta').textContent=game.STANDARD_CODE+' — '+game.STANDARD_DESCRIPTION; $('#gameFrame').src=game.GAME_URL; $('#openGameTab').href=game.GAME_URL; $('#manualScore').max=game.MAX_SCORE; App.seconds=0; clearInterval(App.timer); App.timer=setInterval(()=>{$('#gameTimer').textContent=new Date(++App.seconds*1000).toISOString().slice(14,19)},1000); show('gameView')}
async function finishGame(auto){const score=Number((auto&&auto.score) || $('#manualScore').value || 0), r=await call('completeGameSession',App.currentSession.SESSION_ID,{SCORE:score,MAX_SCORE:(auto&&auto.maxScore)||App.currentSession.game.MAX_SCORE,RESULT_STATUS:(auto&&auto.status)||'completed'},App.token); if(!r.success)return toast(r.message,'error'); toast('Anda telah berjaya menyelesaikan permainan ini.'); clearInterval(App.timer); App.type==='student'?await loadParent():await loadTeacher();}
function onGameMessage(e){const d=e.data||{}; if(d.type==='IGEMKIDS_GAME_RESULT'&&App.currentSession) finishGame(d);}
function draw(canvas,labels,data,label){if(App.charts[canvas])App.charts[canvas].destroy(); const el=$('#'+canvas); if(!el)return; App.charts[canvas]=new Chart(el,{type:'bar',data:{labels,datasets:[{label,data,backgroundColor:['#8ec5ff','#c8b6ff','#ffd6e7','#c8f7dc','#fff1a8']}]},options:{responsive:true,plugins:{legend:{display:false}}}})}
function drawStudentCharts(){const c=App.data.charts||{byDate:[],byField:[]}; draw('studentDateChart',c.byDate.map(x=>x.label),c.byDate.map(x=>x.value),'Markah'); draw('studentFieldChart',c.byField.map(x=>x.label),c.byField.map(x=>x.value),'Bidang')}
async function loadTeacher(){show('teacherView'); $('#teacherName').textContent=App.user.TEACHER_NAME; $('#teacherRole').textContent=App.user.ROLE; const [dash,stu,rep,as,meta]=await Promise.all([call('getTeacherDashboard',App.token),call('getStudents',App.token),call('getReports',App.token,{}),call('getDailyAssignments',App.token),call('getStudentGames',App.token,'')]); if(!dash.success)return toast(dash.message,'error'); App.data=Object.assign({},dash.data,{students:stu.data||[],games:rep.data.games||[],fields:(meta.data&&meta.data.fields)||[],standards:(meta.data&&meta.data.standards)||[],assignments:as.data||[]}); renderTeacher(dash.data); renderAdminTables();}
function renderTeacher(d){const s=d.summary; $('#teacherStats').innerHTML=[stat('Jumlah Murid',s.totalStudents,'fa-children'),stat('Aktif Hari Ini',s.activeToday,'fa-sun'),stat('Jumlah Permainan',s.totalGames,'fa-gamepad'),stat('Main Hari Ini',s.gamesToday,'fa-calendar-day'),stat('Jumlah Markah',s.totalScore,'fa-trophy'),stat('Purata',s.averageScore,'fa-chart-simple'),stat('Murid Aktif',s.mostActive,'fa-star'),stat('Popular',s.popularGame,'fa-fire')].join(''); $('#leaderRows').innerHTML=d.leaderboard.map(r=>`<tr><td>${r.rank}</td><td>${r.STUDENT_ID}</td><td>${r.STUDENT_NAME}</td><td>${r.CLASS}</td><td>${r.totalScore}</td><td>${r.averageScore}</td><td>${r.completed}</td><td>${duration(r.totalDuration)}</td><td>${r.lastActivity}</td></tr>`).join(''); draw('teacherFieldChart',d.charts.byField.map(x=>x.label),d.charts.byField.map(x=>x.value),'Bidang')}
function renderAdminTables(){const students=App.data.students||[], games=App.data.games||[], fields=App.data.fields||[], standards=App.data.standards||[]; $('#gameField').innerHTML=fields.map(f=>`<option value="${f.FIELD_ID}">${f.FIELD_NAME}</option>`).join(''); const refreshStandards=()=>{const f=$('#gameField').value; $('#gameStandard').innerHTML=standards.filter(s=>!f||s.FIELD_ID===f).map(s=>`<option value="${s.STANDARD_ID}">${s.STANDARD_CODE} — ${s.STANDARD_DESCRIPTION}</option>`).join('')}; $('#gameField').onchange=refreshStandards; refreshStandards(); const stOpts=students.map(s=>`<option value="${s.STUDENT_ID}">${s.STUDENT_NAME} (${s.CLASS})</option>`).join(''); ['teacherStudentSelect','assignmentStudent'].forEach(id=>$('#'+id).innerHTML='<option value="">Pilih murid</option>'+stOpts); ['assignmentGame','groupGame'].forEach(id=>$('#'+id).innerHTML=games.map(g=>`<option value="${g.GAME_ID}">${g.GAME_NAME}</option>`).join('')); $('#teacherIndividualGames').innerHTML='<div class="grid cards">'+games.filter(g=>g.STATUS==='AKTIF').map(gameCard).join('')+'</div>'; bindPlayButtons(); $('#gameAdminRows').innerHTML=games.map(g=>`<tr><td>${g.GAME_ID}</td><td>${g.GAME_NAME}</td><td>${g.FIELD_NAME}</td><td>${g.STANDARD_CODE}</td><td><a href="${g.GAME_URL}" target="_blank">Pautan</a></td><td>${g.DIFFICULTY}</td><td>${g.STATUS}</td><td>${g.CREATED_AT}</td><td class="actions"><button class="secondary small" onclick="toggleGame('${g.GAME_ID}')">Aktif/Nyah</button><button class="danger-btn small" onclick="removeGame('${g.GAME_ID}')">Padam</button></td></tr>`).join(''); $('#studentRows').innerHTML=students.map(s=>`<tr><td>${s.STUDENT_ID}</td><td>${s.STUDENT_NAME}</td><td>${s.CLASS}</td><td>${s.PASSWORD}</td><td>${s.STATUS}</td><td>${s.CREATED_AT}</td><td class="actions"><button class="secondary small" onclick="resetPass('${s.STUDENT_ID}')">Reset</button><button class="danger-btn small" onclick="removeStudent('${s.STUDENT_ID}')">Padam</button></td></tr>`).join(''); $('#assignmentRows').innerHTML=(App.data.assignments||[]).map(a=>`<tr><td>${a.ASSIGNMENT_NAME}</td><td>${a.ASSIGNMENT_DATE}</td><td>${a.GAME_NAME}</td><td>${a.TARGET_TYPE}</td><td>${a.STATUS}</td><td><button class="danger-btn small" onclick="removeAssignment('${a.ASSIGNMENT_ID}')">Padam</button></td></tr>`).join('');}
function bindForms(){ $('#gameForm').onsubmit=async e=>{e.preventDefault(); const r=await call('addGame',formObj(e.target),App.token); toast(r.message,r.success?'success':'error'); if(r.success)await loadTeacher()}; $('#assignmentForm').onsubmit=async e=>{e.preventDefault(); const r=await call('createDailyAssignment',formObj(e.target),App.token); toast(r.message,r.success?'success':'error'); if(r.success)await loadTeacher()}; $('#studentForm').onsubmit=async e=>{e.preventDefault(); const r=await call('addStudent',formObj(e.target),App.token); toast(r.message,r.success?'success':'error'); if(r.success)await loadTeacher()}; $('#settingsForm').onsubmit=async e=>{e.preventDefault(); const r=await call('updateSystemSettings',formObj(e.target),App.token); toast(r.message,r.success?'success':'error'); if(r.success)fillSettings(r.data)}; $('#printReport').onclick=()=>print(); $('#exportCsv').onclick=()=>download('igemkids-report.csv','Nama,Kelas,Markah\n'+(App.data.leaderboard||[]).map(r=>`${r.STUDENT_NAME},${r.CLASS},${r.totalScore}`).join('\n')); $('#exportPdf').onclick=async()=>toast((await call('exportReportToPdf',App.token)).message); $('#resetYearBtn').onclick=async()=>{if(!confirm('Tindakan ini akan mengarkibkan rekod tahun semasa. Adakah anda pasti mahu meneruskan?'))return; const r=await call('resetNewYear',$('#newYear').value,$('#keepStudents').checked,$('#resetConfirm').value,App.token); toast(r.message,r.success?'success':'error')}; }
async function toggleGame(id){const r=await call('toggleGameStatus',id,App.token);toast(r.message,r.success?'success':'error'); if(r.success)loadTeacher()} async function removeGame(id){if(confirm('Adakah anda pasti mahu memadam permainan ini?')){const r=await call('deleteGame',id,App.token);toast(r.message,r.success?'success':'error'); if(r.success)loadTeacher()}} async function resetPass(id){const r=await call('resetStudentPassword',id,App.token);toast(r.message,r.success?'success':'error'); if(r.success)loadTeacher()} async function removeStudent(id){if(confirm('Padam murid ini?')){const r=await call('deleteStudent',id,App.token);toast(r.message,r.success?'success':'error'); if(r.success)loadTeacher()}} async function removeAssignment(id){if(confirm('Padam tugasan ini?')){const r=await call('deleteDailyAssignment',id,App.token);toast(r.message,r.success?'success':'error'); if(r.success)loadTeacher()}}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
</script>
