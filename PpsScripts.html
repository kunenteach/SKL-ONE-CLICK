<script>
const PpsState={standardId:'STD1',query:'',status:'ALL',drafts:[],deleted:[],dirty:false,openUnits:new Set()};
const originalNavigate=navigate;
navigate=function(page){if(PpsState.dirty&&App.page==='pps'&&page!=='pps'&&!confirm('Perubahan agihan belum disimpan. Anda pasti mahu meninggalkan halaman ini?'))return;originalNavigate(page)};
window.addEventListener('beforeunload',event=>{if(PpsState.dirty){event.preventDefault();event.returnValue=''}});

function normalizePpsAssignment(row){return {id:String(row.ID_ASSIGNMENT||row.id||''),standard:String(row.STANDARD||row.standard||''),aspectCode:String(row.NO_ASPEK||row.aspectCode||''),subCategory:String(row.SUB_KATEGORI||row.subCategory||''),subItem:String(row.SUB_ITEM||row.subItem||''),teacherId:String(row.ID_GURU||row.teacherId||''),teacherName:String(row.NAMA_GURU||row.teacherName||''),position:String(row.JAWATAN||row.position||''),assignedAt:row.TARIKH_AGIHAN||row.assignedAt||''}}
function preparePpsState(){PpsState.drafts=(App.data.assignments||[]).map(normalizePpsAssignment);PpsState.deleted=[];PpsState.dirty=false}
function ppsKey(target){return [target.standard,target.aspectCode,target.subCategory||'',target.subItem||''].join('|')}
function ppsTargets(standard){return standard.groups.flatMap(group=>{if(group.subCategory==='PANITIA')return App.data.ppsConfig.committees.flatMap(name=>group.items.map(item=>targetFrom(group,item,standard,name)));if(group.subCategory)return (App.data.coCurricularUnits||[]).filter(unit=>unit.category===group.subCategory).map(unit=>targetFrom(group,group.items[0],standard,unit.name,unit.id));return group.items.map(item=>targetFrom(group,item,standard))})}
function targetFrom(group,item,standard,subItem,unitId){return {standard:standard.code,standardId:standard.id,groupCode:group.code,groupName:group.name,aspectCode:item[0],description:item[1],subCategory:group.subCategory||'',subItem:subItem||'',unitId:unitId||''}}
function assignmentsFor(target){const key=ppsKey(target);return PpsState.drafts.filter(item=>ppsKey(item)===key)}
function ppsStats(targets){const keys=new Set(targets.map(ppsKey)),assigned=targets.filter(target=>assignmentsFor(target).some(a=>a.teacherId)).length,totalPps=PpsState.drafts.filter(a=>a.teacherId&&keys.has(ppsKey(a))).length;return {total:targets.length,assigned:assigned,unassigned:targets.length-assigned,totalPps:totalPps,percent:targets.length?Math.round(assigned/targets.length*100):0}}
function currentPpsStandard(){return App.data.ppsConfig.standards.find(item=>item.id===PpsState.standardId)}

renderPps=function(){if(!App.data.ppsConfig){document.getElementById('content').innerHTML=pageHead('PENGURUSAN KAMI','Agihan Kepada PPS','Konfigurasi modul tidak dapat dimuatkan.');return}if(!PpsState.drafts.length&&!PpsState.dirty)preparePpsState();const standard=currentPpsStandard(),targets=ppsTargets(standard),stats=ppsStats(targets);document.getElementById('content').innerHTML=pageHead('PENGURUSAN KAMI','Agihan Kepada PPS','Agih aspek kepada seorang atau lebih Pegawai Penyelaras Standard.')+`<section class="pps-tabs" role="tablist">${App.data.ppsConfig.standards.map(s=>`<button role="tab" aria-selected="${s.id===standard.id}" data-pps-standard="${s.id}" class="${s.id===standard.id?'active':''}">${s.id.replace('STD','STANDARD ')}</button>`).join('')}</section><section class="pps-standard-head"><div><p class="eyebrow">STANDARD DIPILIH</p><h3>${escapeHtml(standard.title)}</h3></div><div class="save-zone"><span id="dirtyState" class="dirty-state ${PpsState.dirty?'visible':''}">• Perubahan belum disimpan</span><button class="btn primary" id="savePps" ${PpsState.dirty?'':'disabled'}>SIMPAN AGIHAN</button></div></section>${ppsKpis(stats)}<div class="toolbar pps-toolbar"><label class="search"><span>⌕</span><input class="field" id="ppsSearch" value="${escapeAttribute(PpsState.query)}" placeholder="Cari aspek, standard, guru atau unit..."></label><select class="field filter" id="ppsStatus"><option value="ALL">SEMUA STATUS</option><option value="UNASSIGNED" ${PpsState.status==='UNASSIGNED'?'selected':''}>BELUM DIAGIHKAN</option><option value="ASSIGNED" ${PpsState.status==='ASSIGNED'?'selected':''}>SUDAH DIAGIHKAN</option></select></div><div id="ppsGrid">${renderPpsGroups(standard,targets)}</div>${teacherDataList()}`;bindPpsEvents()}
function ppsKpis(s){return `<section class="stats pps-stats">${[['Jumlah Aspek',s.total],['Sudah Diagihkan',s.assigned],['Belum Diagihkan',s.unassigned],['Jumlah PPS',s.totalPps],['Peratus Agihan',s.percent+'%']].map(item=>`<article class="stat"><small>${item[0]}</small><strong>${item[1]}</strong><em>${item[0]==='Peratus Agihan'?'AGIHAN SELESAI':'Standard dipilih'}</em></article>`).join('')}</section>`}
function renderPpsGroups(standard,targets){const query=PpsState.query.toLowerCase();return standard.groups.map(group=>{let groupTargets=targets.filter(t=>t.groupCode===group.code);groupTargets=groupTargets.filter(target=>{const hay=[target.aspectCode,target.description,target.groupName,target.subItem].concat(assignmentsFor(target).flatMap(a=>[a.teacherName,a.position])).join(' ').toLowerCase();const statusOk=PpsState.status==='ALL'||(PpsState.status==='ASSIGNED'&&assignmentsFor(target).some(a=>a.teacherId))||(PpsState.status==='UNASSIGNED'&&!assignmentsFor(target).some(a=>a.teacherId));return (!query||hay.includes(query))&&statusOk});if(!groupTargets.length)return '';return group.subCategory?renderNestedGroup(group,groupTargets):renderRegularGroup(group,groupTargets)}).join('')||`<article class="panel">${emptyState('Tiada rekod sepadan dengan carian atau filter semasa.')}</article>`}
function renderRegularGroup(group,targets){return `<section class="pps-group"><header class="pps-group-head"><span>${group.code}</span><div><small>ASPEK UTAMA</small><h3>${escapeHtml(group.name)}</h3></div></header><div class="pps-table"><div class="pps-row pps-row-head"><b>ASPEK</b><b>NAMA ASPEK / STANDARD KUALITI</b><b>PPS</b></div>${targets.map(renderPpsRow).join('')}</div></section>`}
function renderNestedGroup(group,targets){const items=[...new Set(targets.map(t=>t.subItem))];return `<section class="pps-group nested"><header class="pps-group-head"><span>${group.code}</span><div><small>${group.subCategory==='PANITIA'?'PANITIA':'UNIT / PASUKAN'}</small><h3>${escapeHtml(group.name)}</h3></div><button class="btn secondary add-unit" data-category="${group.subCategory}" ${group.subCategory==='PANITIA'?'hidden':''}>+ TAMBAH ${group.name.replace('PENGURUSAN ','')}</button></header><div class="unit-list">${items.map(name=>{const unitTargets=targets.filter(t=>t.subItem===name),open=PpsState.openUnits.has(group.subCategory+'|'+name);return `<article class="unit-card ${open?'open':''}"><button class="unit-toggle" data-unit-toggle="${escapeAttribute(group.subCategory+'|'+name)}"><span class="unit-chevron">›</span><div><small>${group.subCategory.replaceAll('_',' ')}</small><b>${escapeHtml(name)}</b></div>${statusBadge(unitTargets)}</button>${group.subCategory!=='PANITIA'?`<button class="remove-unit" data-unit-id="${escapeAttribute(unitTargets[0].unitId)}" data-unit-name="${escapeAttribute(name)}" title="Buang unit">BUANG</button>`:''}<div class="unit-content"><div class="pps-table"><div class="pps-row pps-row-head"><b>ASPEK</b><b>STANDARD KUALITI</b><b>PPS</b></div>${unitTargets.map(renderPpsRow).join('')}</div>${group.subCategory==='PANITIA'?`<button class="bulk-assign" data-bulk="${escapeAttribute(name)}">Gunakan PPS aspek pertama untuk semua aspek panitia ini</button>`:''}</div></article>`}).join('')}</div></section>`}
function renderPpsRow(target){const assignments=assignmentsFor(target);return `<div class="pps-row" data-target="${escapeAttribute(ppsKey(target))}"><div class="aspect-code" data-label="ASPEK"><b>${target.aspectCode}</b>${statusBadge([target])}</div><div class="aspect-copy" data-label="STANDARD KUALITI">${escapeHtml(target.description)}${target.subItem?`<small>${escapeHtml(target.subItem)}</small>`:''}</div><div class="assignment-cell" data-label="PPS">${assignments.map((assignment,index)=>assignmentFields(target,assignment,index)).join('')}<button class="add-pps" data-add-pps="${escapeAttribute(ppsKey(target))}">+ TAMBAH PPS</button></div></div>`}
function assignmentFields(target,a,index){return `<div class="assignment-pair" data-assignment-id="${escapeAttribute(a.id)}"><input class="field teacher-picker" list="masterGuruList" data-key="${escapeAttribute(ppsKey(target))}" data-index="${index}" value="${escapeAttribute(a.teacherName)}" placeholder="Pilih PPS" aria-label="Pilih Nama Guru"><select class="field position-picker" data-key="${escapeAttribute(ppsKey(target))}" data-index="${index}" aria-label="Pilih Jawatan"><option value="">Pilih Jawatan</option>${App.data.positions.map(p=>`<option ${p===a.position?'selected':''}>${escapeHtml(p)}</option>`).join('')}</select><button class="remove-pps" data-key="${escapeAttribute(ppsKey(target))}" data-index="${index}" aria-label="Buang PPS">×</button></div>`}
function teacherDataList(){return `<datalist id="masterGuruList">${App.data.teachers.map(t=>`<option value="${escapeAttribute(t.name)}">${escapeHtml(t.position||'')}</option>`).join('')}</datalist>`}
function statusBadge(targets){const assigned=targets.every(target=>assignmentsFor(target).some(a=>a.teacherId));return `<span class="assignment-status ${assigned?'assigned':'unassigned'}">${assigned?'SUDAH DIAGIHKAN':'BELUM DIAGIHKAN'}</span>`}

function bindPpsEvents(){document.querySelectorAll('[data-pps-standard]').forEach(b=>b.onclick=()=>{PpsState.standardId=b.dataset.ppsStandard;PpsState.query='';PpsState.status='ALL';renderPps()});document.getElementById('ppsSearch').oninput=debounce(event=>{PpsState.query=event.target.value;renderPps()},180);document.getElementById('ppsStatus').onchange=e=>{PpsState.status=e.target.value;renderPps()};document.getElementById('savePps').onclick=savePpsChanges;document.querySelectorAll('[data-unit-toggle]').forEach(b=>b.onclick=()=>{const key=b.dataset.unitToggle;PpsState.openUnits.has(key)?PpsState.openUnits.delete(key):PpsState.openUnits.add(key);renderPps()});document.querySelectorAll('[data-add-pps]').forEach(b=>b.onclick=()=>addPps(b.dataset.addPps));document.querySelectorAll('.teacher-picker').forEach(i=>i.onchange=()=>updateTeacher(i));document.querySelectorAll('.position-picker').forEach(s=>s.onchange=()=>updatePosition(s));document.querySelectorAll('.remove-pps').forEach(b=>b.onclick=()=>removePps(b));document.querySelectorAll('.add-unit').forEach(b=>b.onclick=()=>openUnitModal(b.dataset.category));document.querySelectorAll('.remove-unit').forEach(b=>b.onclick=()=>removeUnit(b));document.querySelectorAll('.bulk-assign').forEach(b=>b.onclick=()=>bulkAssignCommittee(b.dataset.bulk))}
function targetByKey(key){return ppsTargets(currentPpsStandard()).find(t=>ppsKey(t)===key)}function draftAt(key,index){return assignmentsFor(targetByKey(key))[Number(index)]}
function addPps(key){const target=targetByKey(key);PpsState.drafts.push({id:'',standard:target.standard,aspectCode:target.aspectCode,subCategory:target.subCategory,subItem:target.subItem,teacherId:'',teacherName:'',position:''});markDirty();renderPps()}
function updateTeacher(input){const draft=draftAt(input.dataset.key,input.dataset.index),teacher=App.data.teachers.find(t=>t.name.toUpperCase()===input.value.trim().toUpperCase());draft.teacherId=teacher?teacher.id:'';draft.teacherName=teacher?teacher.name:input.value.trim();if(teacher&&teacher.position)draft.position=teacher.position;markDirty();renderPps()}
function updatePosition(select){draftAt(select.dataset.key,select.dataset.index).position=select.value;markDirty()}
function removePps(button){const draft=draftAt(button.dataset.key,button.dataset.index);if(draft.id&&!confirm('Anda pasti mahu membuang PPS ini daripada aspek tersebut?'))return;if(draft.id)PpsState.deleted.push(draft.id);PpsState.drafts=PpsState.drafts.filter(item=>item!==draft);markDirty();renderPps()}
function bulkAssignCommittee(name){const targets=ppsTargets(currentPpsStandard()).filter(t=>t.subCategory==='PANITIA'&&t.subItem===name),source=assignmentsFor(targets[0]).filter(a=>a.teacherId);if(!source.length){showToast('Pilih PPS bagi aspek pertama terlebih dahulu.');return}targets.slice(1).forEach(target=>{PpsState.drafts=PpsState.drafts.filter(a=>ppsKey(a)!==ppsKey(target));source.forEach(a=>PpsState.drafts.push({...a,id:'',aspectCode:target.aspectCode}))});markDirty();renderPps();showToast('PPS disalin kepada empat aspek panitia.')}
function markDirty(){PpsState.dirty=true;const state=document.getElementById('dirtyState'),save=document.getElementById('savePps');if(state)state.classList.add('visible');if(save)save.disabled=false}
function savePpsChanges(){const invalid=PpsState.drafts.find(a=>!a.teacherId||!a.position);if(invalid){showToast('Lengkapkan nama guru dan jawatan sebelum menyimpan.');return}const button=document.getElementById('savePps');button.disabled=true;button.textContent='MENYIMPAN...';callServer('savePpsAssignments',{upserts:PpsState.drafts,deletes:PpsState.deleted},result=>{App.data.assignments=result.assignments;preparePpsState();renderPps();showToast('✓ Agihan PPS berjaya disimpan.')},handleError)}
function openUnitModal(category){const labels={KELAB_PERSATUAN:'Kelab/Persatuan',BADAN_BERUNIFORM:'Badan Beruniform',SUKAN_PERMAINAN:'Sukan/Permainan'},drawer=document.getElementById('drawer');drawer.innerHTML=`<div class="panel-head"><div><p class="eyebrow">TAMBAH UNIT</p><h2>${labels[category]}</h2></div><button class="icon-btn" id="closeDrawer">×</button></div><label>Nama ${labels[category]}<input id="newUnitName" class="field" maxlength="120" autocomplete="off"></label><button class="btn primary" id="saveUnit" style="width:100%;margin-top:20px">SIMPAN</button>`;drawer.classList.add('open');document.getElementById('overlay').classList.add('open');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('saveUnit').onclick=()=>{const name=document.getElementById('newUnitName').value.trim();if(!name)return showToast('Masukkan nama unit.');callServer('createCoCurricularUnit',{category:category,name:name},unit=>{App.data.coCurricularUnits.push(unit);PpsState.openUnits.add(category+'|'+unit.name);closeDrawer();renderPps();showToast('✓ Unit berjaya ditambah.')},handleError)}}
function removeUnit(button){if(!confirm(`Anda pasti mahu membuang ${button.dataset.unitName}? Assignment sejarah akan dikekalkan untuk audit.`))return;callServer('deleteCoCurricularUnit',button.dataset.unitId,()=>{App.data.coCurricularUnits=App.data.coCurricularUnits.filter(u=>u.id!==button.dataset.unitId);renderPps();showToast('✓ Unit berjaya dibuang.')},handleError)}
function callServer(method,payload,success,failure){if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(success).withFailureHandler(error=>{if(error&&/Sesi telah tamat/.test(error.message||''))logoutApplication();failure(error)})[method](payload,App.sessionToken)}else{failure({message:'Operasi simpan memerlukan deployment Google Apps Script dan Google Sheet.'})}}
function debounce(fn,delay){let timer;return function(){const args=arguments;clearTimeout(timer);timer=setTimeout(()=>fn.apply(null,args),delay)}}function escapeAttribute(value){return escapeHtml(String(value)).replaceAll('`','&#96;')}
</script>
