<!doctype html><html lang="ms"><head><meta charset="utf-8"><style>
@page{size:A4 portrait;margin:6mm}:root{--font-header-title:20pt;--font-school:14pt;--font-slogan:9pt;--font-report-title:20pt;--font-body:12pt;--font-label:12pt;--font-caption:8pt;--font-footer:7pt;--font-medium-title:17pt;--font-medium-body:12pt;--font-dense-title:14pt;--font-dense-body:12pt;--font-answer-family:"Trebuchet MS","Aptos",Arial,sans-serif;--font-label-family:"Comic Sans MS","Segoe Print","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:#152033;font-family:var(--font-answer-family);-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#e8e5df}.sheet{width:198mm;min-height:285mm;margin:auto;background:#fffdf8;position:relative;overflow:hidden;padding:7mm;box-shadow:0 3mm 10mm #07152b24}.sheet:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(225deg,#082b63 0 43%,#e4aa2d 44% 50%,#fff0 51%) top right/55mm 39mm no-repeat,linear-gradient(45deg,#082b63 0 43%,#e4aa2d 44% 50%,#fff0 51%) bottom left/61mm 46mm no-repeat,linear-gradient(225deg,#f5d77b 0 17%,#fff0 18%) top right/32mm 24mm no-repeat,linear-gradient(45deg,#f5d77b 0 17%,#fff0 18%) bottom left/36mm 28mm no-repeat,linear-gradient(90deg,#faf2e4,#fffdf8 12%,#fffdf8 88%,#faf2e4)}.sheet:after{content:"";position:absolute;inset:3mm;z-index:0;pointer-events:none;border:1.2mm solid #f5ecdc;box-shadow:inset 0 0 5mm #b8904b18}.sheet>*{position:relative;z-index:1}.head{height:28mm;background:linear-gradient(120deg,#061f4b 0%,#0a3472 78%,#dca72d 78%,#f1c95b 82%,#082b63 82%);color:white;border-radius:3mm;padding:4mm 6mm;display:flex;align-items:center;box-shadow:0 1.5mm 4mm #07152b2b}.logo{width:19mm;height:19mm;object-fit:contain;margin-right:5mm}.logo-fallback{width:19mm;height:19mm;border-radius:50%;background:#e4aa2d;color:#08254f;display:grid;place-items:center;font-weight:bold;margin-right:5mm}.head h1{font-size:var(--font-header-title);margin:0;letter-spacing:.08em;font-weight:900}.head h2{font-size:var(--font-school);margin:1mm 0;font-weight:800}.head p{font-size:var(--font-slogan);margin:0;color:#f7e6b6}.content{display:grid;grid-template-columns:54% 46%;gap:3mm;margin-top:3mm;position:relative;align-items:start}.no-images .content{grid-template-columns:1fr}.facts{display:grid;grid-template-columns:1fr 1fr;gap:1.25mm;align-content:start;grid-auto-rows:min-content}.box{border:1px solid #a9bdd8;border-radius:2mm;padding:1.35mm 1.8mm;background:linear-gradient(135deg,#e5edf8 0%,#f0f4fa 100%);min-height:0;box-shadow:0 .5mm 1.5mm #0b26520c}.box.wide{grid-column:1/-1}.meta-box{background:linear-gradient(135deg,#dce7f5 0%,#edf3fa 100%);border-color:#9fb5d2;border-left:1mm solid #dca72d}.meta-box:nth-child(even){background:linear-gradient(135deg,#e7eef8 0%,#d8e4f3 100%)}.label{display:block;font-family:var(--font-label-family);text-transform:uppercase;color:#0a376f;font-size:var(--font-label);font-weight:800;letter-spacing:.05em;margin-bottom:.35mm}.value{font-size:var(--font-body);line-height:1.2;color:#102d52;white-space:pre-wrap}.title{padding:2.2mm;background:linear-gradient(120deg,#cfddf0 0%,#e6edf7 82%,#dca72d 82%,#f1c95b 86%,#d7e3f3 86%);border:1px solid #91aacb;border-left:1.8mm solid #e4aa2d;box-shadow:0 1mm 3mm #07152b26}.title .label{font-size:var(--font-label);color:#0a376f}.title .value{font-size:var(--font-report-title);line-height:1.12;font-weight:900;color:#071f4a}.list{margin:0;padding-left:4mm}.list li{margin:.4mm 0}.photo-grid{height:242mm;display:grid;gap:2mm;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr}.photo{margin:0;overflow:hidden;border-radius:2.5mm;background:#edf0f4;position:relative;border:1px solid #d8c89f;box-shadow:0 1mm 3mm #07152b1c;min-height:0}.photo img{width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;object-position:center;display:block}.photo figcaption{position:absolute;inset:auto 0 0;background:#061f4bd9;color:#fff;padding:1.3mm;font-size:var(--font-caption);border-top:1px solid #e4aa2d}.images-1 .photo-grid,.images-2 .photo-grid,.images-3 .photo-grid{grid-template-columns:1fr}.images-4 .photo-grid,.images-5 .photo-grid{grid-template-columns:repeat(2,1fr)}.images-6 .photo-grid{grid-template-columns:1fr;grid-template-rows:repeat(6,minmax(0,1fr));gap:1.5mm}.images-7 .photo-grid{grid-template-columns:repeat(3,1fr)}.text-medium .value{font-size:var(--font-medium-body)}.text-medium .box{padding:1.05mm 1.45mm}.text-medium .title .value{font-size:var(--font-medium-title)}.text-dense .value{font-size:var(--font-dense-body);line-height:1.15}.text-dense .box{padding:.8mm 1.2mm}.text-dense .title .value{font-size:var(--font-dense-title)}.foot{position:absolute;bottom:2mm;right:8mm;color:#73581b;font-size:var(--font-footer);font-weight:700}@media print{body{background:#fff}.sheet{margin:0;box-shadow:none}}
</style></head><body><div class="sheet <?= report.layoutClass ?>"><header class="head"><? if(report.logoData){ ?><img class="logo" src="<?!= report.logoData ?>"><? } else { ?><div class="logo-fallback">SKL</div><? } ?><div><h1>ONE PAGE REPORT</h1><h2><?= school.name ?></h2><p><?= school.slogan ?></p></div></header><div class="content"><section class="facts">
<? function box(label,value,wide,cls){if(!value)return; ?><div class="box <?= wide?'wide':'' ?> <?= cls||'' ?>"><span class="label"><?= label ?></span><div class="value"><?= value ?></div></div><? } ?>
<? box('Nama Laporan',report.name,true,'title'); box('Unit',report.unit,false,'meta-box'); box('Tahun',report.year,false,'meta-box'); box('Tarikh / Hari',(report.formattedDate||'')+(report.day?' · '+report.day:''),false,'meta-box'); box('Tempat',report.place,false,'meta-box'); box('Peringkat',report.level,false,'meta-box'); box('Anjuran',report.displayOrganiser,false,'meta-box'); box('Sasaran Peserta',report.target,false,'meta-box'); box('Objektif 1',report.objective1,true); box('Objektif 2',report.objective2,true); box('Impak',report.impact,true); if(report.hasAchievement)box('Pencapaian',report.achievement,true); ?>
<? if(report.hasGuests&&report.guests&&report.guests.length){ ?><div class="box wide"><span class="label">Jemputan Luar</span><ol class="value list"><? report.guests.forEach(function(g){if(g.name||g.position||g.workplace){ ?><li><b><?= g.name ?></b><?= g.position?' — '+g.position:'' ?><?= g.workplace?', '+g.workplace:'' ?></li><? }}); ?></ol></div><? } ?>
<? box('Penambahbaikan',report.improvement,true); ?><? if(report.teachers&&report.teachers.length){ ?><div class="box wide"><span class="label">Penglibatan Guru</span><div class="value"><?= report.teachers.join(' • ') ?></div></div><? } ?><? box('Laporan Disediakan Oleh',report.preparedBy,true); ?>
</section><? if(report.images&&report.images.length){ ?><section class="photo-grid"><? report.images.forEach(function(img){ ?><figure class="photo"><img src="<?!= img.data ?>" alt="Gambar laporan"><? if(img.caption){ ?><figcaption><?= img.caption ?></figcaption><? } ?></figure><? }); ?></section><? } ?></div><div class="foot"><?= report.id||'PRATONTON' ?> · SK LORMALONG</div></div></body></html>
